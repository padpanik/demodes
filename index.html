<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Désdale</title>
  <!-- Page privée entre amis : on demande aux moteurs de recherche de ne pas la référencer -->
  <meta name="robots" content="noindex, nofollow, noarchive">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#f3f5f7">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Désdale">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <link rel="stylesheet" href="commun.css">
  <style>
    .jeux { display: grid; gap: 12px; }
    .jeu {
      display: flex; align-items: center; gap: 16px; width: 100%; text-align: left;
      padding: 18px 16px; border: 2px solid transparent; border-radius: 18px; background: #fff; cursor: pointer;
      font: inherit; color: inherit; text-decoration: none; box-sizing: border-box;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05), 0 4px 14px rgba(29,43,54,0.06);
    }
    /* Fiches de même hauteur : colonne d'icône fixe, descriptif sur deux lignes au plus */
    .jeu { min-height: 98px; }
    .jeu > :first-child { width: 56px; box-sizing: border-box; flex-shrink: 0; justify-content: center; }
    .jeu > .ico-gb { height: 56px; }
    .jeu > div:nth-child(2) { flex: 1; min-width: 0; }
    .jeu .desc { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .jeu { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    .jeu.souleve { position: relative; z-index: 5; transition: none; box-shadow: 0 12px 28px rgba(29,43,54,0.25); border-color: #2c3e50; }
    .tri-move { transition: transform 0.2s ease; }
    .astuce-tri { float: right; font-weight: 400; font-size: 0.8em; color: #a3adb5; margin-top: 2px; }
    .jeu:active { transform: scale(0.99); }
    .jeu.dernier { border-color: #2c3e50; }
    .jeu .nom { font-size: 1.25em; font-weight: 800; }
    .jeu .desc { color: #6b7a86; font-size: 0.9em; margin-top: 2px; }
    .jeu .badge { display: inline-block; margin-top: 6px; font-size: 0.78em; font-weight: 700; color: #8a5a00; background: #fff3d6; border-radius: 8px; padding: 2px 8px; }
    .badge-quitter { margin-left: 8px; border: none; border-radius: 6px; background: #f3d9a8; color: #6b4500; font: inherit; font-weight: 700; padding: 1px 6px; cursor: pointer; }
    .jeu .fleche { margin-left: auto; font-size: 1.4em; color: #a3adb5; }
    /* Icône Brilliant : petite grille de couleurs */
    .ico-grille { display: grid; grid-template-columns: repeat(3, 14px); gap: 3px; flex-shrink: 0; }
    .ico-grille span { width: 14px; height: 14px; border-radius: 4px; box-shadow: inset 0 -2px 0 rgba(0,0,0,0.18); }
    /* Icône Yams : cinq dés */
    .ico-des { display: grid; grid-template-columns: repeat(3, 15px); gap: 3px; flex-shrink: 0; width: 51px; justify-content: center; }
    .ico-des span { width: 15px; height: 15px; border-radius: 4px; background: #fff; border: 1.5px solid #2c3e50; box-sizing: border-box;
                    display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 800; }
    /* Icône Backgammon : flèches du plateau */
    .ico-bg { display: grid; grid-template-columns: repeat(3, 15px); grid-template-rows: 22px 22px; gap: 2px 3px; flex-shrink: 0; width: 51px; padding: 3px; box-sizing: content-box; background: #e9d6b0; border-radius: 6px; }
    .ico-bg span { background: #8a5a35; clip-path: polygon(0 0, 100% 0, 50% 100%); }
    .ico-bg span:nth-child(even) { background: #c48a52; }
    .ico-bg span.bas { clip-path: polygon(50% 0, 100% 100%, 0 100%); }
    /* Icône Assaut : petit plateau, deux camps et un lac */
    .ico-as { display: grid; grid-template-columns: repeat(3, 15px); gap: 3px; flex-shrink: 0; width: 51px; }
    .ico-as span { width: 15px; height: 15px; border-radius: 3px; }
    /* Icône Bataille navale : un bout de mer avec un navire, un touché et une gerbe d'eau */
    .ico-bn { display: grid; grid-template-columns: repeat(3, 15px); gap: 2px; flex-shrink: 0; width: 49px; padding: 1px; background: #2a6f97; border-radius: 5px; }
    .ico-bn span { width: 15px; height: 15px; border-radius: 3px; background: rgba(255,255,255,0.12); position: relative; }
    .ico-bn span.n { background: #8f9ba4; }
    .ico-bn span.t::after { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: radial-gradient(#ffe082, #ff6d00 55%, #c62828); }
    .ico-bn span.e::after { content: ''; position: absolute; inset: 4px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.85); }
    /* Icône Gribouille : un gribouillis et un crayon */
    .ico-pb { width: 51px; height: 51px; border-radius: 10px; background: #fff; box-shadow: inset 0 0 0 2px #2c3e50; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
              font: 900 30px/1 Georgia, 'Times New Roman', serif; color: #c0392b; }
    .jeu > .ico-pb { height: 56px; }
    /* Bloc fixe en haut : « En ligne » et « Mon compagnon » restent visibles quand on fait défiler les jeux */
    .haut-fixe { position: sticky; top: 0; z-index: 20; background: #f3f5f7; padding: 6px 0 10px; margin-bottom: 4px; }
    .carte-compagnon { display: flex; align-items: center; gap: 12px; background: linear-gradient(135deg, #fff8e1, #ffeccc); border-radius: 18px; padding: 8px 14px 8px 8px;
                       text-decoration: none; color: inherit; box-shadow: 0 1px 2px rgba(0,0,0,0.05), 0 4px 14px rgba(29,43,54,0.06); }
    .carte-compagnon svg { width: 62px; height: 66px; flex-shrink: 0; }
    .carte-compagnon .infos-cp { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .carte-compagnon .nom-cp { font-weight: 800; font-size: 1.15em; }
    .carte-compagnon .etat-cp { font-size: 0.85em; color: #6b5a3a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .carte-compagnon .defis-cp { margin-left: 6px; font-size: 0.6em; font-weight: 800; color: #9a6400; background: #fff; border-radius: 8px; padding: 1px 6px; vertical-align: 2px; }
    .carte-compagnon .etoiles-cp { background: #fff; color: #7a5600; font-weight: 900; border-radius: 12px; padding: 4px 10px; flex-shrink: 0; }
    .ico-cp { width: 51px; height: 51px; border-radius: 14px; background: #fff3c4; display: flex; align-items: center; justify-content: center; font-size: 30px; flex-shrink: 0; }
    .jeu > .ico-cp { height: 56px; }
    .ico-lc { width: 51px; height: 56px; border-radius: 10px; background: #1f6f5c; display: flex; align-items: center; justify-content: center; gap: 2px; flex-shrink: 0; }
    .ico-lc span { width: 15px; height: 17px; border-radius: 3px; background: #f6dfa6; color: #2b2116; font-weight: 900; font-size: 12px; display: flex; align-items: center; justify-content: center; }
    .ico-lc span:nth-child(2) { transform: translateY(-5px); }
    .ico-dm { width: 51px; height: 56px; border-radius: 10px; background: #2f6b4f; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .ico-ql { width: 51px; height: 51px; border-radius: 10px; background: #1f5fae; display: grid; grid-template-columns: repeat(3, 12px); gap: 3px; align-content: center; justify-content: center; flex-shrink: 0; }
    .jeu > .ico-ql { height: 56px; }
    .ico-ql span { width: 12px; height: 12px; border-radius: 50%; background: #f3f5f7; }
    .ico-ql span.r { background: #e53935; } .ico-ql span.j { background: #fbc02d; }
    .ico-ag { display: grid; grid-template-columns: repeat(3, 15px); gap: 3px; flex-shrink: 0; }
    .ico-ag span { width: 15px; height: 15px; border-radius: 4px; box-shadow: inset 0 -2px 0 rgba(0,0,0,0.15); }
    .ico-gb { width: 51px; height: 51px; border-radius: 10px; background: #fff; box-shadow: inset 0 0 0 2px #2c3e50; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .titre-section { font-weight: 700; color: #5b6b78; margin: 4px 4px 10px; }
  </style>
</head>
<body>
  <div id="app" class="app">

    <!-- ACCÈS PRIVÉ : écran affiché tant que le code n'a pas été saisi sur ce téléphone -->
    <div v-if="!accesOk" class="acces">
      <div class="logo"><span v-for="c in logo" :key="c" :style="{ background: c }"></span></div>
      <h1>Accès privé</h1>
      <p>Cette application est réservée à un cercle d'amis.<br>Saisis le code qu'on t'a donné.</p>
      <form @submit.prevent="validerAcces">
        <input type="password" v-model="codeSaisi" placeholder="Code d'accès" autocomplete="off" autocapitalize="none" :disabled="accesEnCours">
        <button class="btn principal" type="submit" :disabled="accesEnCours || !codeSaisi.trim()">{{ accesEnCours ? 'Vérification…' : 'Entrer' }}</button>
      </form>
      <p class="acces-erreur" v-if="accesErreur">{{ accesErreur }}</p>
    </div>

    <!-- CHOIX DU JEU -->
    <template v-else>
      <header class="hero">
        <div class="logo"><span v-for="c in logo" :key="c" :style="{ background: c }"></span></div>
        <div>
          <h1>Désdale</h1>
          <p>Les jeux de dés à jouer ensemble</p>
        </div>
      </header>

      <!-- En haut, fixes pendant que la liste des jeux défile : qui est en ligne, et mon compagnon -->
      <div class="haut-fixe">
        <!-- Salon global : qui est en ligne (rempli par salon-global.js) -->
        <div id="sg-ici" style="margin-bottom:8px"></div>
        <a class="carte-compagnon" href="compagnon.html" @click="retenir('compagnon')">
          <svg v-if="compagnon" viewBox="0 -6 200 216" v-html="compagnon.dessin"></svg>
          <span v-else class="ico-cp">🐾</span>
          <span class="infos-cp">
            <span class="nom-cp">{{ compagnon ? compagnon.nom : 'Mon compagnon' }} <small v-if="compagnon" style="font-weight:600;font-size:0.6em;color:#9a7a2a">{{ compagnon.age }}</small><small v-if="compagnon && compagnon.defis" class="defis-cp">🏆 {{ compagnon.defis }}</small></span>
            <span class="etat-cp">{{ compagnon ? compagnon.etat : 'Adopte un petit animal' }}</span>
          </span>
          <span class="etoiles-cp">⭐ {{ compagnon ? compagnon.etoiles : etoiles }}</span>
        </a>
      </div>

      <div class="titre-section">Choisis ton jeu<span class="astuce-tri">{{ glisse ? 'glisse puis lâche' : 'appui long pour trier' }}</span></div>
      <!-- Ordre propre à chaque téléphone : appui long sur une fiche, puis la faire glisser -->
      <transition-group name="tri" tag="div" class="jeux" ref="liste">
        <a v-for="j in jeuxTries" :key="j.id" :ref="'jeu-' + j.id" class="jeu" :data-id="j.id"
           :class="{ dernier: dernierJeu === j.id, souleve: glisse === j.id }"
           :style="glisse === j.id ? { transform: 'translateY(' + decalY + 'px) scale(1.03)' } : null"
           :href="j.page" @click="cliquer($event, j.id)" @contextmenu.prevent
           @touchstart="debutAppui($event, j.id)" @mousedown="debutAppui($event, j.id)">
          <div v-if="j.id === 'brilliant'" class="ico-grille"><span v-for="(c, i) in grille" :key="i" :style="{ background: c }"></span></div>
          <div v-else-if="j.id === 'yams'" class="ico-des"><span v-for="n in [5, 3, 6, 2, 4]" :key="n">{{ n }}</span></div>
          <div v-else-if="j.id === 'assaut'" class="ico-as"><span v-for="(c, k) in ['#b5422f','#b5422f','#b5422f','#5d9bc9','#a9c08c','#5d9bc9','#2f5f9e','#2f5f9e','#2f5f9e']" :key="k" :style="{ background: c }"></span></div>
          <div v-else-if="j.id === 'gribouille'" class="ico-gb"><svg width="38" height="38" viewBox="0 0 38 38"><path d="M5 27 C 9 12, 14 30, 19 17 S 28 8, 33 20" fill="none" stroke="#e74c3c" stroke-width="3.5" stroke-linecap="round"/><path d="M24 33 l9 -9 l3 3 l-9 9 z" fill="#f2b134"/><path d="M24 33 l-2 5 l5 -2 z" fill="#2c3e50"/></svg></div>
          <div v-else-if="j.id === 'petitbac'" class="ico-pb">B</div>
          <div v-else-if="j.id === 'quatre'" class="ico-ql"><span v-for="(c, k) in ['', 'j', '', 'r', 'r', 'j', 'j', 'r', 'r']" :key="k" :class="c"></span></div>
          <div v-else-if="j.id === 'domino'" class="ico-dm"><svg width="40" height="44" viewBox="0 0 40 44"><g transform="rotate(-14 20 22)"><rect x="10" y="2" width="20" height="40" rx="3.5" fill="#fffdf6" stroke="#2b2b2b" stroke-width="1.6"/><path d="M12.5 22 H27.5" stroke="#2b2b2b" stroke-width="1.6"/><circle cx="15" cy="8" r="2.2"/><circle cx="20" cy="12" r="2.2"/><circle cx="25" cy="16" r="2.2"/><circle cx="15" cy="28" r="2.2"/><circle cx="25" cy="28" r="2.2"/><circle cx="15" cy="36" r="2.2"/><circle cx="25" cy="36" r="2.2"/></g></svg></div>
          <div v-else-if="j.id === 'lettres'" class="ico-lc"><span v-for="(l, k) in ['M', 'O', 'T']" :key="k">{{ l }}</span></div>
          <div v-else-if="j.id === 'agents'" class="ico-ag"><span v-for="(c, k) in ['#c0392b','#e6dcc3','#2f6fb0','#2f6fb0','#1d2b36','#c0392b','#e6dcc3','#c0392b','#2f6fb0']" :key="k" :style="{ background: c }"></span></div>
          <div v-else-if="j.id === 'bataille'" class="ico-bn"><span v-for="(x, k) in ['', 'e', '', 'n', 'n', 't', '', '', 'e']" :key="k" :class="x"></span></div>
          <div v-else class="ico-bg"><span v-for="k in 6" :key="k" :class="{ bas: k > 3 }"></span></div>
          <div>
            <div class="nom">{{ j.nom }}</div>
            <div class="desc">{{ j.desc }}</div>
            <span class="badge" v-if="j.enCours">{{ j.enCours }}<button class="badge-quitter" @click.prevent.stop="quitter(j)" aria-label="Quitter ce salon">✕ Quitter</button></span>
          </div>
          <span class="fleche">›</span>
        </a>
      </transition-group>

      <section class="carte installer" v-if="!estInstallee && (installPossible || estIOS)" style="margin-top:16px">
        <div class="titre-carte">📲 Installer l'application</div>
        <button v-if="installPossible" class="btn principal" @click="installer">Ajouter à l'écran d'accueil</button>
        <div v-else class="aide">Sur iPhone : touche <strong>Partager</strong> puis <strong>« Sur l'écran d'accueil »</strong>.</div>
      </section>

      <p class="version" style="margin-top:18px">Désdale · version {{ version }}</p>
    </template>
  </div>

  <script src="commun.js"></script>
  <script src="etoiles.js"></script>
  <script src="compagnon-commun.js"></script>
  <script>
    const B = '#5dc1ec', V = '#7fcc8f', J = '#f7d24a', R = '#ee7163', M = '#b39ddb', O = '#f9a15a';

    // Partie en cours dans un jeu ? (pour l'afficher, et y retourner tout seul au lancement)
    function etatJeu(cle) {
      var sv = lireStockage(cle);
      if (!sv) return null;
      if (sv.role && sv.salon) return { salon: true, texte: '● Partie en cours · salon « ' + sv.salon + ' »' };
      return null;
    }

    new Vue({
      el: '#app',
      data: {
        version: VERSION,
        accesOk: false,
        codeSaisi: '',
        accesErreur: '',
        accesEnCours: false,
        dernierJeu: lireStockage('desdale-dernier-jeu') || '',
        ordre: lireStockage('desdale-ordre-jeux') || [],
        glisse: null,      // jeu soulevé par un appui long
        decalY: 0,
        maj: 0,
        logo: [B, J, R, V],
        grille: [J, V, B, R, M, V, O, R, J],
        installPossible: false,
        estInstallee: window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true,
        estIOS: /iphone|ipad|ipod/i.test(navigator.userAgent)
      },
      computed: {
        // Jeux dans l'ordre choisi sur ce téléphone (les jeux inconnus de l'ordre gardent leur place par défaut, à la fin)
        jeuxTries: function() {
          var o = this.ordre, rang = (j) => { var i = o.indexOf(j.id); return i < 0 ? 100 : i; };
          return this.jeux.map((j, k) => ({ j: j, k: k })).sort((a, b) => (rang(a.j) - rang(b.j)) || (a.k - b.k)).map(x => x.j);
        },
        etoiles: function() { this.maj; return Etoiles.solde(); },
        // Mon compagnon, dessiné sur sa carte avec son humeur du moment
        compagnon: function() {
          this.maj;
          var a = lireStockage('compagnon-animal');
          if (!a || typeof CP === 'undefined') return null;
          var n = CP.niveaux(a), h = CP.humeur(n), nuit = CP.estNuit() && h !== 'triste';
          var bas = CP.BESOINS.filter(b => n[b.id] < 30).map(b => ({ repas: 'a faim', eau: 'a soif', toilette: 'voudrait un bain', calin: 'voudrait un câlin' })[b.id]);
          var d = CP.etatDefis ? CP.etatDefis().defis : [];
          return { nom: a.nom, age: CP.age(a.ne), dessin: CP.dessin(a, h, nuit), etoiles: Etoiles.solde(), defis: d.length ? d.filter(x => x.fait).length + '/3' : '',
                   etat: bas.length ? '😟 ' + bas.join(', ') : nuit ? '😴 Dort paisiblement' : h === 'content' ? '😊 Très heureux' : '🙂 Va bien' };
        },
        jeux: function() {
          this.maj;   // recalcul après « Quitter »
          var b = etatJeu('brillant-sauvegarde-v1'), y = etatJeu('yams-sauvegarde'), g = etatJeu('bg-sauvegarde'), a = etatJeu('assaut-sauvegarde'), n = etatJeu('bataille-sauvegarde'), d = etatJeu('gribouille-sauvegarde'), pb = etatJeu('petitbac-sauvegarde'), ag = etatJeu('agents-sauvegarde'), ql = etatJeu('quatre-sauvegarde'), dm = etatJeu('domino-sauvegarde'), lc = etatJeu('lettres-sauvegarde');
          return [
            { id: 'brilliant', nom: 'Brilliant', page: 'brilliant.html', desc: 'Roll & write : remplis les zones de ta grille.', enCours: b && b.texte },
            { id: 'yams', nom: 'Yams', page: 'yams.html', desc: '5 dés, 3 lancers, seul ou à plusieurs.', enCours: y && y.texte },
            { id: 'backgammon', nom: 'Backgammon', page: 'backgammon.html', desc: 'À deux, avec le videau et les gammons.', enCours: g && g.texte },
            { id: 'assaut', nom: 'Assaut', page: 'assaut.html', desc: 'Stratégie à pièces cachées, seul ou à deux.', enCours: a && a.texte },
            { id: 'bataille', nom: 'Bataille navale', page: 'bataille.html', desc: 'Coule la flotte adverse, seul ou à deux.', enCours: n && n.texte },
            { id: 'gribouille', nom: 'Gribouille', page: 'gribouille.html', desc: 'L\'un dessine, les autres devinent.', enCours: d && d.texte },
            { id: 'petitbac', nom: 'Petit bac', page: 'petitbac.html', desc: 'Une lettre, un mot par catégorie, STOP !', enCours: pb && pb.texte },
            { id: 'agents', nom: 'Agents secrets', page: 'agents.html', desc: 'Deux équipes, un mot et un nombre pour tout dire.', enCours: ag && ag.texte },
            { id: 'quatre', nom: 'Quatre en ligne', page: 'quatre.html', desc: 'Aligne 4 jetons : seul contre l\'ordinateur ou à deux.', enCours: ql && ql.texte },
            { id: 'domino', nom: 'Dominos', page: 'domino.html', desc: 'Dominos ou triominos, seul ou de 2 à 4.', enCours: dm && dm.texte },
            { id: 'lettres', nom: 'Lettres croisées', page: 'lettres.html', desc: 'Des mots sur la grille, seul ou de 2 à 4.', enCours: lc && lc.texte }
          ];
        }
      },
      created: function() {
        setInterval(() => { this.maj++; }, 30000);   // humeur du compagnon et étoiles à jour
        // Un défi de la semaine réussi pendant une partie (si le module n'était pas encore chargé) : on le valide ici
        setTimeout(() => { try { if (CP.verifierDefis(true).length) this.maj++; } catch (e) {} }, 1200);
        // Glisser au doigt : il faut pouvoir bloquer le défilement de la page pendant le tri
        document.addEventListener('touchmove', (e) => { if (this.glisse) { e.preventDefault(); this.deplacer(e.touches[0].clientY); } else this.bougeAvant(e.touches[0]); }, { passive: false });
        document.addEventListener('touchend', () => this.finAppui());
        document.addEventListener('touchcancel', () => this.finAppui());
        document.addEventListener('mousemove', (e) => { if (this.glisse) this.deplacer(e.clientY); else this.bougeAvant(e); });
        document.addEventListener('mouseup', () => this.finAppui());
        window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); this._invitation = e; this.installPossible = true; });
        window.addEventListener('appinstalled', () => { this.installPossible = false; this.estInstallee = true; });
        if (ACCES.memorise()) { this.accesOk = true; this.reprendre(); }
      },
      methods: {
        // Au lancement de l'appli, une partie en salon reprend directement (sauf si on vient choisir un jeu)
        reprendre: function() {
          if (/[?&]choix\b/.test(location.search)) return;
          var enSalon = this.jeux.find(j => j.enCours);
          if (enSalon) location.replace(enSalon.page);
        },
        retenir: function(id) { ecrireStockage('desdale-dernier-jeu', id); },
        cliquer: function(e, id) {
          // Pas d'ouverture du jeu à la fin d'un tri
          if (this.glisse || Date.now() - (this._finTri || 0) < 500) { e.preventDefault(); return; }
          this.retenir(id);
        },
        // ---- Tri des fiches : appui long (0,45 s sans bouger), puis glisser ----
        debutAppui: function(e, id) {
          if (e.type === 'mousedown' && e.button !== 0) return;
          if (e.type === 'mousedown' && this._touche && Date.now() - this._touche < 800) return;   // souris simulée après un toucher
          if (e.type === 'touchstart') this._touche = Date.now();
          var p = e.touches ? e.touches[0] : e;
          clearTimeout(this._minuterie);
          this._appui = { id: id, x: p.clientX, y: p.clientY };
          this._minuterie = setTimeout(() => this.soulever(), 450);
        },
        bougeAvant: function(p) {
          // Le doigt bouge avant la fin de l'appui long : c'est un défilement, pas un tri
          if (this._appui && Math.hypot(p.clientX - this._appui.x, p.clientY - this._appui.y) > 8) { clearTimeout(this._minuterie); this._appui = null; }
        },
        soulever: function() {
          if (!this._appui) return;
          var el = this.$refs['jeu-' + this._appui.id][0];
          this.glisse = this._appui.id;
          this.decalY = 0;
          // Ancre : distance entre le doigt et le haut de la fiche, pour qu'elle suive le doigt sans sauter
          this._ancre = this._appui.y - el.getBoundingClientRect().top;
          vibrer(25);
        },
        deplacer: function(y) {
          var id = this.glisse, ids = this.jeuxTries.map(j => j.id);
          // Place visée : on compare le doigt au milieu des autres fiches (positions sans déplacement)
          var cible = 0;
          ids.forEach((autre) => {
            if (autre === id) return;
            var r = this.$refs['jeu-' + autre][0].getBoundingClientRect();
            if (y > r.top + r.height / 2) cible++;
          });
          var ici = ids.indexOf(id);
          if (cible !== ici) {
            ids.splice(ici, 1); ids.splice(cible, 0, id);
            this.ordre = ids;
          }
          this.$nextTick(() => {
            var el = this.$refs['jeu-' + id] && this.$refs['jeu-' + id][0];
            if (!el || this.glisse !== id) return;
            // Position naturelle de la fiche (sans le décalage en cours), puis décalage pour rester sous le doigt
            var naturel = el.getBoundingClientRect().top - this.decalY;
            this.decalY = y - this._ancre - naturel;
          });
        },
        finAppui: function() {
          clearTimeout(this._minuterie);
          this._appui = null;
          if (!this.glisse) return;
          this.glisse = null;
          this.decalY = 0;
          this._finTri = Date.now();
          ecrireStockage('desdale-ordre-jeux', this.jeuxTries.map(j => j.id));
        },
        // Oublie le salon en cours d'un jeu (il ne sera plus rouvert tout seul)
        quitter: function(j) {
          if (!confirm('Quitter le salon de ' + j.nom + ' ? La partie en salon ne sera plus reprise sur ce téléphone.')) return;
          oublierSalonDuJeu(j.id);
          this.maj++;
        },
        validerAcces: function() {
          if (this.accesEnCours || !this.codeSaisi.trim()) return;
          this.accesEnCours = true;
          this.accesErreur = '';
          ACCES.valider(this.codeSaisi).then(ok => {
            this.accesEnCours = false;
            if (!ok) { this.accesErreur = 'Code incorrect.'; return; }
            this.codeSaisi = '';
            this.accesOk = true;
          }).catch(() => {
            this.accesEnCours = false;
            this.accesErreur = 'Ce navigateur ne permet pas de vérifier le code.';
          });
        },
        installer: function() {
          var invit = this._invitation;
          if (!invit) return;
          invit.prompt();
          invit.userChoice.then(() => { this._invitation = null; this.installPossible = false; });
        }
      }
    });
  </script>
  <script src="salon-global.js" data-jeu="accueil"></script>
</body>
