        },
        soloProchainePenalite: function() {
          return SOLO_LANCERS_PENALITE.find(n => n > this.soloTraits) || null;
        },
        soloLancersTotal: function() { return SOLO_LANCERS; },
        // Zones qu'on peut pénaliser : pas encore complétées, et dont le 1er ou 2e gain est encore libre
        soloZonesPenalisables: function() {
          return Object.keys(this.niveau.zones).filter(z =>
            this.mesGains[z] === undefined && !this.zoneEstPleine(z) && (this.prisIndex[z] || 0) < 2);
        },
        soloPenaliteChoix: function() {
          var z = this.zoneSurlignee;
          if (!z || this.soloZonesPenalisables.indexOf(z) === -1) return null;
          return { zone: z, gain: this.niveau.zones[z].gains[this.prisIndex[z] || 0], nom: this.nomZone(z) };
        },
        recordNiveau: function() { return this.records[this.level] || 0; },
        connexionTexte: function() {
          return this.connexion === 'ok' ? 'en ligne' : 'reconnexion…';
        },
        logoCouleurs: function() { return [PALETTE.B, PALETTE.J, PALETTE.R, PALETTE.V]; },
        // Aperçu miniature de chaque fiche (7×7 couleurs) pour le choix du niveau
        miniCartes: function() {
          var res = {};
          Object.keys(NIVEAUX).forEach(n => {
            res[n] = NIVEAUX[n].grille.map(lireLigne).reduce((a, l) => a.concat(l), []).map(z => PALETTE[z[0]]);
          });
          return res;
        },
        historiqueRecent: function() { return this.historique.slice().reverse(); },

        // Tout ce qu'il faut pour reprendre la partie après un rechargement
        etatSauvegarde: function() {
          var cells = {};
          Object.keys(this.cellsData).forEach(k => {
            var c = this.cellsData[k];
            if (c.label) cells[k] = [c.label, c.depart ? 1 : 0];
          });
          return JSON.stringify({
            pseudo: this.pseudoInput, salon: this.roomCode, role: this.role,
            level: this.level, partieId: this.partieId, phase: this.phase, cells: cells,
            lancerId: this.lancerId, aJoue: this.aJoue, dernierCoup: this.dernierCoup,
            mesCompletions: this.mesCompletions, mesGains: this.mesGains,
            dice1: this.dice1, dice2: this.dice2, last_player: this.last_player,
            scores: this.scores, prisIndex: this.prisIndex, lancerResolu: this.lancerResolu,
            prochainLanceur: this.prochainLanceur, finPartie: this.finPartie, finMasquee: this.finMasquee,
            enAttentePartie: this.enAttentePartie, infoAttente: this.infoAttente,
            soloTraits: this.soloTraits, soloPenalite: this.soloPenalite,
            joueurs: this.joueurs, historique: this.historique.slice(-80),
            // "salle" n'est pas réactive, mais elle change toujours en même temps que "joueurs"
            salle: this.role === 'hote' ? salle : null
          });
        },
        absentsBloquants: function() {
          return this.role === 'hote' && this.joueurs.some(j => j.connecte === false && j.attendu);
        },
        prochainAbsent: function() {
          var j = this.joueurs.find(j => j.pseudo === this.prochainLanceur);
          return !!(j && j.connecte === false);
        },
        seuil: function() {
          return seuilPour(Math.max(this.joueurs.length, 1));
        },
        monScore: function() {
          return this.scores[this.monPseudoAffiche || 'Moi'] || 0;
        },
        scoresListe: function() {
          var noms = this.joueurs.length ? this.joueurs.map(j => j.pseudo) : Object.keys(this.scores);
          var moi = this.monPseudoAffiche || 'Moi';
          var absents = this.joueurs.filter(j => j.connecte === false).map(j => j.pseudo);
          return noms.map(n => ({ pseudo: n, points: this.scores[n] || 0, moi: n === moi, absent: absents.indexOf(n) !== -1 }))
                     .sort((a, b) => b.points - a.points);
        },
        peutLancerLocal: function() {
          if (this.phase !== 'jeu' || this.finPartie) return false;
          if (!this.role) return this.aJoue && !this.soloPenalite && this.soloTraits < SOLO_LANCERS; // solo
          if (this.connexion !== 'ok') return false;
          if (this.prochainLanceur && this.prochainLanceur !== this.monPseudoAffiche && !this.prochainAbsent) return false;
          return this.enAttente.length === 0;
        },
        aideGenerale: function() {
          if (this.phase === 'depart') return 'Touche une case pour y placer un chiffre de départ.';
          if (this.dice1 === null) return this.modeSolo ? 'Partie solo : ' + SOLO_LANCERS + ' lancers pour marquer un maximum de points.'
                                                        : 'Lance les dés pour commencer.';
          if (this.aucunCoup) return 'Aucun coup possible avec ce lancer : passe ton tour.';
          if (!this.aJoue) return 'Place un ' + this.dice1 + ' à côté d\'un ' + this.dice2 +
            (this.dice1 !== this.dice2 ? ', ou un ' + this.dice2 + ' à côté d\'un ' + this.dice1 : '') +
            ' (cases qui clignotent).';
          return 'Coup joué. Touche une case ou une zone pour voir sa règle.';
        },
        joueursTexte: function() {
          return this.joueurs.map(j => j.pseudo +
            (j.connecte === false ? ' 💤' : (j.pret ? ' ✓' : ' (départ…)'))).join(', ');
        },
        // Joueurs qui bloquent le prochain lancer (départ non validé, ou coup pas encore joué).
        // Un joueur déconnecté bloque aussi, sauf si l'hôte a choisi de ne plus l'attendre.
        enAttente: function() {
          if (!this.role) return [];
          var nom = j => j.pseudo + (j.connecte === false ? ' 💤' : '');
          var attendus = this.joueurs.filter(j => j.attendu !== false);
          var pasPrets = attendus.filter(j => !j.pret).map(nom);
          if (pasPrets.length) return pasPrets;
          if (this.lancerId === 0 || this.lancerResolu === this.lancerId) return [];
          return attendus.filter(j => !j.joue).map(nom);
        },
        attenteTexte: function() {
          if (!this.enAttente.length) return '';
          var pasPrets = this.joueurs.some(j => j.attendu !== false && !j.pret);
          return (pasPrets ? 'En attente du départ de : ' : 'En attente du coup de : ') + this.enAttente.join(', ');
        },

        zoneInfo: function() {
          if (!this.zoneSurlignee) return null;
          var id = this.zoneSurlignee;
          var z = this.zonesListe.find(c => c.id === id);
          var def = this.niveau.zones[id];
          var possibles;
          if (z.rempli === z.total) {
            var g = this.mesGains[id];
            possibles = g !== undefined ? '<b>complète : +' + def.gains[g] + ' pts</b>' : '<b>zone complète</b>';
          } else {
            var p = this.valeursZone(id);
            possibles = p.length ? 'possible : <b>' + p.join(' ') + '</b>' : '<b>plus rien de possible</b>';
          }
          return {
            titre: 'Zone ' + NOMS_COULEURS[id[0]] + ' ' + REGLES[def.regle].symbole + ' · ' + z.rempli + '/' + z.total,
            regle: REGLES[def.regle].texte,
            possibles: possibles,
            fond: palir(PALETTE[id[0]], 0.7)
          };
        }
      },
      methods: {
        // ---------- Grille ----------
        buildGrid: function() {
          var niv = NIVEAUX[this.level];
          var lignes = niv.grille.map(lireLigne);
          var etoiles = niv.etoiles.map(e => e[1] + '-' + e[0]); // [ligne, col] -> 'x-y'
          var data = {};
          for (var y = 0; y < this.size; y++) {
            for (var x = 0; x < this.size; x++) {
              var zone = lignes[y][x];
              data[x + '-' + y] = {
                zone: zone,
                color: PALETTE[zone[0]],
                label: '',
                selected: false,
                etoile: etoiles.indexOf(x + '-' + y) !== -1,
                depart: false
              };
            }
          }
          this.zoneSurlignee = null;
          this.cellsData = data;
          this.grilleLevel = this.level;
          this.phase = 'depart';
          this.lancerId = 0;
          this.aJoue = true;
          this.dernierCoup = null;
          this.dice1 = null;
          this.dice2 = null;
          this.last_player = '';
          this.prochainLanceur = null;
          this.mesCompletions = [];
          this.scores = {};
          this.prisIndex = {};
          this.mesGains = {};
          this.lancerResolu = 0;
          this.finPartie = null;
          this.finMasquee = false;
          this.soloTraits = 0;
          this.soloPenalite = false;
          this.signalerPret(false);
        },

        // ---------- Phase de départ ----------
        afficherMessage: function(txt) {
          this.message = txt;
          clearTimeout(this._timerMsg);
          this._timerMsg = setTimeout(() => { this.message = ''; }, 2500);
        },
        valeursZone: function(zone) {
          return valeursPermises(this.niveau.zones[zone].regle, this.chiffresParZone[zone] || []);
        },
        valeursVoisines: function(key) {
          var [x, y] = key.split('-').map(Number);
          return [[x, y - 1], [x, y + 1], [x - 1, y], [x + 1, y]]
            .map(([a, b]) => this.cellsData[a + '-' + b])
            .filter(c => c && c.label)
            .map(c => c.label);
        },
        // Explique pourquoi une case vide n'est pas jouable avec le lancer en cours
        raisonInterdit: function(key) {
          var d1 = this.dice1, d2 = this.dice2;
          var voisins = this.valeursVoisines(key);
          var aCoteDe1 = voisins.indexOf(d1) !== -1, aCoteDe2 = voisins.indexOf(d2) !== -1;
          if (!aCoteDe1 && !aCoteDe2) {
            return d1 === d2 ? 'Il faut être à côté d\'un ' + d1 + '.'
                             : 'Il faut être à côté d\'un ' + d1 + ' ou d\'un ' + d2 + '.';
          }
          return 'La règle de cette zone interdit ce chiffre.';
        },
        zoneADejaUnDepart: function(zone) {
          return Object.values(this.cellsData).some(c => c.depart && c.zone === zone);
        },
        effacerDepart: function() {
          Object.values(this.cellsData).forEach(c => {
            if (c.depart) { c.label = ''; c.depart = false; }
          });
        },
        departEtoilesHasard: function() {
          this.effacerDepart();
          this.zoneSurlignee = null;
          var etoiles = Object.values(this.cellsData).filter(c => c.etoile);
          // On mélange jusqu'à respecter les zones à plage fixe (orange 1-3 / 4-6)
          for (var essai = 0; essai < 200; essai++) {
            var chiffres = [1, 2, 3, 4, 5, 6].sort(() => Math.random() - 0.5);
            var ok = etoiles.every((c, i) =>
              valeursPermises(this.niveau.zones[c.zone].regle, []).indexOf(chiffres[i]) !== -1);
            if (ok) break;
          }
          etoiles.forEach((c, i) => { c.label = chiffres[i]; c.depart = true; });
        },
        validerDepart: function() {
          if (this.departUtilises.length < 6) return;
          this.phase = 'jeu';
          this.zoneSurlignee = null;
          this.signalerPret(true);
          this.ajouterLog('Départ validé.', true);
        },
        signalerPret: function(pret) {
          if (this.role === 'client') this.envoyerHote({ action: 'PRET', pseudo: monPseudo, pret: pret });
          // côté hôte, le watcher "phase" republie la liste
        },
        // Hôte : les autres joueurs qu'on attend (connectés, ou absents qu'on n'a pas écartés)
        autresAttendus: function() {
          return Object.values(salle.infos).filter(i => i.connecte || !i.patienceLevee);
        },
        tousPrets: function() {
          return this.phase === 'jeu' && this.autresAttendus().every(i => i.pret);
        },
        tousOntJoue: function() {
          return this.aJoue && this.autresAttendus().every(i => i.aJoue);
        },
        leverPatience: function() {
          Object.values(salle.infos).forEach(i => { if (!i.connecte) i.patienceLevee = true; });
          this.ajouterLog('L\'hôte n\'attend plus les joueurs absents.', true);
          this.majJoueurs();
          this.verifierResolution();
        },
        reinitialiserSalle: function() {
          Object.values(salle.infos).forEach(i => { i.pret = false; i.aJoue = true; i.completions = []; });
          salle.gains = {};
          // la liste d'attente se vide : chacun se réinscrit en recevant l'annonce de la nouvelle partie
          salle.attente = {};
        },
        estConnecte: function(pseudo) {
          if (pseudo === monPseudo) return true;
          var i = salle.infos[pseudo];
          return !!(i && i.connecte);
        },
        // Côté hôte : renvoie la raison d'un refus de lancer, ou '' si c'est permis
        refusLancer: function(joueur) {
          if (this.finPartie) return 'La partie est terminée.';
          if (!this.tousPrets()) return 'Tout le monde n\'a pas fini son départ.';
          if (this.lancerId > 0 && !this.tousOntJoue()) return 'Tout le monde n\'a pas encore joué ce lancer.';
          if (this.prochainLanceur && joueur !== this.prochainLanceur && this.estConnecte(this.prochainLanceur))
            return 'C\'est à ' + this.prochainLanceur + ' de lancer.';
          return '';
        },

        // ---------- Coups ----------
        signalerJoue: function() {
          if (this.role === 'client') {
            this.envoyerHote({ action: 'JOUE', pseudo: monPseudo, lancerId: this.lancerId,
                               joue: this.aJoue, zones: this.mesCompletions });
          }
          // côté hôte, le watcher "aJoue" republie la liste
        },
        passer: function() {
          if (this.aJoue) return;
          this.mesCompletions = [];
          this.aJoue = true;
          this.dernierCoup = null;
          this.zoneSurlignee = null;
          this.signalerJoue();
        },
        annulerCoup: function() {
          if (!this.dernierCoup) return;
          var c = this.cellsData[this.dernierCoup];
          c.label = '';
          this.mesCompletions = [];
          this.dernierCoup = null;
          this.aJoue = false;
          this.signalerJoue();
        },
        // ---------- Zones complétées et score ----------
        classeGain: function(zone, i) {
          if (this.mesGains[zone] === i) return 'entoure';
          // Les gains pris par quelqu'un sont barrés, sauf le 3e qui ne l'est jamais
          if (i < 2 && i < (this.prisIndex[zone] || 0)) return 'gain-barre'; // (pas "barre" : déjà pris par la barre du haut)
          return '';
        },
        zoneEstPleine: function(zone) {
          return Object.values(this.cellsData).every(c => c.zone !== zone || c.label);
        },
        nomZone: function(zone) {
          return 'zone ' + NOMS_COULEURS[zone[0]] + ' ' + REGLES[this.niveau.zones[zone].regle].symbole;
        },
        // Hôte (ou solo) : décompte des zones complétées dès que tout le monde a joué le lancer
        verifierResolution: function() {
          if (this.role === 'client' || this.finPartie) return;
          if (this.lancerId === 0 || this.lancerResolu === this.lancerId) return;
          if (this.role === 'hote' ? !this.tousOntJoue() : !this.aJoue) return;

          var moi = monPseudo || this.monPseudoAffiche || 'Moi';
          var participants = [{ pseudo: moi, zones: this.mesCompletions }].concat(
            Object.keys(salle.infos).map(p => ({
              pseudo: p, zones: salle.infos[p].aJoue ? (salle.infos[p].completions || []) : []
            }))
          );

          // Regroupe par zone : ceux qui la complètent au même lancer prennent le même gain
          var parZone = {};
          participants.forEach(p => p.zones.forEach(z => { (parZone[z] = parZone[z] || []).push(p.pseudo); }));

          var scores = Object.assign({}, this.scores);
          participants.forEach(p => { if (scores[p.pseudo] === undefined) scores[p.pseudo] = 0; });
          var prisIndex = Object.assign({}, this.prisIndex);
          var attributions = [];
          Object.keys(parZone).forEach(z => {
            var idx = prisIndex[z] || 0;
            var gain = this.niveau.zones[z].gains[idx];
            parZone[z].forEach(pseudo => {
              scores[pseudo] += gain;
              attributions.push({ pseudo: pseudo, zone: z, index: idx, gain: gain });
            });
            prisIndex[z] = Math.min(idx + 1, 2);
          });

          // Fin de partie : quelqu'un atteint le seuil ; le plus haut score gagne (égalité partagée)
          // En solo : pas de seuil, la partie s'arrête après le dernier lancer (44e)
          var seuil = seuilPour(participants.length);
          var fin = null;
          var atteints = this.modeSolo ? [] : Object.keys(scores).filter(p => scores[p] >= seuil);
          if (this.modeSolo && this.soloTraits >= SOLO_LANCERS) {
            var score = scores[moi] || 0;
            var ancien = this.records[this.level] || 0;
            fin = { solo: true, gagnants: [moi], score: score, record: Math.max(ancien, score),
                    nouveauRecord: score > ancien, ancienRecord: ancien };
            if (score > ancien) {
              this.$set(this.records, this.level, score);
              ecrireStockage('brillant-records', this.records);
            }
          }
          if (atteints.length) {
            var max = Math.max.apply(null, atteints.map(p => scores[p]));
            fin = { gagnants: atteints.filter(p => scores[p] === max), seuil: seuil };
          }

          // L'hôte mémorise les gains de chacun (pour les renvoyer à un joueur qui se reconnecte)
          attributions.forEach(a => {
            salle.gains[a.pseudo] = salle.gains[a.pseudo] || {};
            salle.gains[a.pseudo][a.zone] = a.index;
          });

          var payload = { action: 'SCORES', lancerId: this.lancerId, scores: scores,
                          prisIndex: prisIndex, attributions: attributions, fin: fin };
          this.appliquerScores(payload);
          this.broadcast(payload);
        },
        appliquerScores: function(data) {
          var moi = monPseudo || this.monPseudoAffiche || 'Moi';
          this.lancerResolu = data.lancerId;
          this.scores = data.scores;
          this.prisIndex = data.prisIndex;
          if (data.lancerId === this.lancerId) this.dernierCoup = null; // lancer décompté : plus d'annulation
          var annonces = [];
          data.attributions.forEach(a => {
            var qui = a.pseudo === moi ? 'Tu complètes' : a.pseudo + ' complète';
            if (a.pseudo === moi) this.$set(this.mesGains, a.zone, a.index);
            annonces.push(qui + ' la ' + this.nomZone(a.zone) + ' : +' + a.gain);
            this.ajouterLog(`${a.pseudo} complète la ${this.nomZone(a.zone)} : +${a.gain} pts`, true);
          });
          if (annonces.length) this.afficherMessage('🎉 ' + annonces.join(' · '));
          if (this.sonActif && data.attributions.length && !(data.fin && !this.finPartie)) {
            var pourMoi = data.attributions.some(a => a.pseudo === moi);
            Sons.jouer('zone', pourMoi);
            vibrer(pourMoi ? [60, 50, 120] : 40);
          }
          if (data.fin && !this.finPartie) {
            if (this.sonActif) { Sons.jouer('victoire'); vibrer([100, 60, 100, 60, 250]); }
            this.finPartie = data.fin;
            this.finMasquee = false;
            this.ajouterLog(data.fin.solo ? `Partie solo terminée : ${data.fin.score} points.`
                                          : `Fin de partie : ${data.fin.gagnants.join(' et ')} gagne(nt).`, true);
          }
        },
        masquerFin: function() { this.finMasquee = true; },
        nouvellePartie: function() {
          if (this.role === 'client') return;
          this.buildGrid();
          if (this.role === 'hote') {
            this.partieId = nouvelId();
            this.reinitialiserSalle();
            this.broadcast({ action: 'NIVEAU', level: this.level, partieId: this.partieId });
            this.majJoueurs();
            this.ajouterLog('Nouvelle partie !', true);
          }
        },

        // ---------- Variante solo ----------
        demarrerSolo: function() {
          var enCours = this.phase === 'jeu' || Object.values(this.cellsData).some(c => c.label);
          if (enCours && !this.finPartie && !confirm('Recommencer une partie solo ? Ta grille actuelle sera effacée.')) return;
          monPseudo = this.pseudoInput.trim() || 'Moi';
          this.buildGrid();
          this.actif_tab = 'play';
          this.ajouterLog(`Nouvelle partie solo, niveau ${this.level}.`, true);
        },
        // Appelé à chaque lancer solo : un trait sur la piste, et peut-être une pénalité
        soloApresLancer: function() {
          this.soloTraits++;
          if (SOLO_LANCERS_PENALITE.indexOf(this.soloTraits) !== -1 && this.soloZonesPenalisables.length) {
            this.soloPenalite = true;
            if (this.sonActif) vibrer([40, 40, 40]);
          }
        },
        appliquerPenaliteSolo: function() {
          var choix = this.soloPenaliteChoix;
          if (!choix) return;
          this.$set(this.prisIndex, choix.zone, (this.prisIndex[choix.zone] || 0) + 1);
          this.soloPenalite = false;
          this.zoneSurlignee = null;
          this.ajouterLog(`Pénalité solo : le ${choix.gain} de la ${choix.nom} est barré.`, true);
        },

        basculerZone: function(id) {
          this.zoneSurlignee = (this.zoneSurlignee === id) ? null : id;
        },

        // ---------- Historique / réseau ----------
        ajouterLog: function(msg, isSystem = false) {
          this.historique.push({ msg: msg, system: isSystem });
          if (this.historique.length > 200) this.historique.splice(0, this.historique.length - 200);
        },
        broadcast: function (data) {
          connections.forEach(c => { try { if (c.open) c.send(data); } catch (e) {} });
        },
        envoyerHote: function(data) {
          if (hostConn && hostConn.open && this.connexion === 'ok') {
            try { hostConn.send(data); } catch (e) {}
          }
        },
        majJoueurs: function() {
          if (this.role !== 'hote') return;
          this.joueurs = salle.ordre.map(p => {
            if (p === monPseudo) {
              return { pseudo: p, pret: this.phase === 'jeu', joue: this.aJoue, connecte: true, attendu: true };
            }
            var i = salle.infos[p];
            return { pseudo: p, pret: !!i.pret, joue: i.aJoue !== false, connecte: !!i.connecte,
                     attendu: !!(i.connecte || !i.patienceLevee) };
          });
          this.joueursEnAttente = Object.keys(salle.attente || {});
          this.broadcast({ action: 'LISTE_JOUEURS', joueurs: this.joueurs, prochainLanceur: this.prochainLanceur,
                           attente: this.joueursEnAttente, scores: this.scores });
        },
        validerPseudo: function() {
          monPseudo = this.pseudoInput.trim();
          if (!monPseudo) {
            alert('Merci de saisir un pseudo.');
            return false;
          }
          return true;
        },
        // garder = true : reconnexion, on conserve le salon, le rôle et les joueurs
        reinitialiserPeer: function(garder) {
          clearTimeout(this._timerReco);
          var ancien = peer;
          peer = null;
          connections = [];
          connParPseudo = {};
          hostConn = null;
          isHost = false;
          if (ancien) { try { ancien.destroy(); } catch (e) {} }
          if (!garder) {
            this.role = null;
            this.joueurs = [];
            this.roomCode = '';
            this.connexion = 'aucune';
          }
        },
        planifierReconnexion: function(delai) {
          clearTimeout(this._timerReco);
          this._timerReco = setTimeout(() => {
            if (!this.role || this.connexion === 'ok') return;
            if (this.role === 'hote') this.creerPartie(true);
            else this.rejoindrePartie(true);
          }, delai || 3000);
        },
        quitterSalon: function() {
          if (!confirm('Quitter le salon ? Ta grille sera effacée de ce téléphone.')) return;
          this.reinitialiserPeer(false);
          this.status = 'Statut : Non connecté';
          this.partieId = null;
          salle = { ordre: [], infos: {}, gains: {}, attente: {} };
          this.enAttentePartie = false;
          this.partieDisponible = false;
          this.joueursEnAttente = [];
          this.buildGrid();
          this.ajouterLog('Tu as quitté le salon.', true);
          effacerStockage(CLE_SAUVEGARDE);
        },

        // ---------- Client ----------
        rejoindrePartie: function(reprise) {
          var target;
          if (reprise) {
            target = this.roomCode;
          } else {
            if (!this.validerPseudo()) return;
            target = this.channelInput.trim();
            if (!target) return alert('Saisis le nom du salon à rejoindre.');
          }

          this.reinitialiserPeer(!!reprise);
          this.connexion = reprise ? 'perdue' : 'connexion';
          this.status = reprise ? 'Statut : Reconnexion…' : 'Statut : Connexion...';
          var monPeer = peer = new Peer();

          monPeer.on('open', () => {
            if (peer !== monPeer) return;
            var conn = hostConn = monPeer.connect(ACCES.idSalon(target), { reliable: true });

            // Si l'hôte ne répond pas, on réessaie (ou on abandonne pour une 1re connexion)
            var delaiOuverture = setTimeout(() => {
              if (hostConn !== conn || this.connexion === 'ok') return;
              if (this.role) { this.status = 'Statut : Hôte injoignable, nouvelle tentative…'; this.planifierReconnexion(); }
              else { this.status = 'Statut : Non connecté'; alert('Impossible de joindre ce salon.'); this.reinitialiserPeer(false); }
            }, 10000);

            conn.on('open', () => {
              if (hostConn !== conn) return;
              clearTimeout(delaiOuverture);
              dernierMsgHote = Date.now();
              this.connexion = 'ok';
              this.role = 'client';
              this.roomCode = target;
              this.status = `Statut : Connecté (${monPseudo})`;
              if (!reprise) this.actif_tab = 'play';
              conn.send({ action: 'REJOINDRE', pseudo: monPseudo, clientId: clientId });
            });

            conn.on('data', (data) => {
              if (hostConn !== conn) return;
              dernierMsgHote = Date.now();
              this.recevoirDeHote(data);
            });

            conn.on('close', () => { if (hostConn === conn) this.perteHote(); });
            conn.on('error', () => { if (hostConn === conn) this.perteHote(); });
          });

          monPeer.on('disconnected', () => {
            // Perte du serveur de mise en relation : la connexion directe à l'hôte peut continuer
            if (peer === monPeer && !monPeer.destroyed) { try { monPeer.reconnect(); } catch (e) {} }
          });

          monPeer.on('error', (err) => {
            if (peer !== monPeer) return;
            if (this.role) {
              // Déjà dans un salon : on réessaie sans déranger
              this.status = 'Statut : Hôte injoignable, nouvelle tentative…';
              this.connexion = 'perdue';
              this.planifierReconnexion();
            } else {
              this.status = 'Statut : Non connecté';
              this.reinitialiserPeer(false);
              if (err.type === 'peer-unavailable') alert('Impossible de trouver ce salon.');
              else alert('Erreur : ' + err.message);
            }
          });
        },
        perteHote: function() {
          if (this.connexion === 'perdue' && this._timerReco) return;
          if (this.connexion === 'ok') this.ajouterLog('Connexion à l\'hôte perdue, reconnexion…', true);
          var c = hostConn;
          hostConn = null;
          if (c) { try { c.close(); } catch (e) {} }
          this.connexion = 'perdue';
          this.status = 'Statut : Reconnexion…';
          this.planifierReconnexion(1500);
        },
        recevoirDeHote: function(data) {
          // En attente : on ne suit que la vie du salon, pas le jeu
          if (this.enAttentePartie && ['RESULTAT', 'SCORES', 'REFUS'].indexOf(data.action) !== -1 && !data.fatal) {
            if (data.action === 'SCORES') this.scores = data.scores;
            return;
          }
          if (this.enAttentePartie && data.action === 'NIVEAU') {
            this.annoncerNouvellePartie();
            return;
          }
          switch (data.action) {
            case 'ATTENTE':
              this.enAttentePartie = true;
              this.partieDisponible = false;
              this.joueurs = data.joueurs || [];
              this.scores = data.scores || {};
              this.infoAttente = data.fin ? 'Elle vient de se terminer, l\'hôte va en relancer une.'
                                          : 'Niveau ' + data.level + ', ' + data.lancerId + ' lancer' + (data.lancerId > 1 ? 's' : '') + ' déjà joué' + (data.lancerId > 1 ? 's' : '') + '.';
              this.actif_tab = 'config';
              break;
            case 'PING': break;
            case 'ETAT': this.appliquerEtat(data); break;
            case 'RESULTAT': this.afficherResultat(data.joueur, data.valeur, data.lancerId, data.prochainLanceur); break;
            case 'REFUS':
              if (data.fatal) {
                alert(data.message);
                this.reinitialiserPeer(false);
                this.status = 'Statut : Non connecté';
              } else {
                this.afficherMessage(data.message);
              }
              break;
            case 'LISTE_JOUEURS':
              this.joueurs = data.joueurs;
              this.prochainLanceur = data.prochainLanceur || null;
              this.joueursEnAttente = data.attente || [];
              if (this.enAttentePartie && data.scores) this.scores = data.scores;
              break;
            case 'SCORES': this.appliquerScores(data); break;
            case 'NIVEAU':
              // Nouvelle partie (ou nouveau niveau) décidée par l'hôte
              this.partieId = data.partieId;
              this.level = data.level;
              this.buildGrid(); // fixe grilleLevel : le watcher ne reconstruit pas une 2e fois
              this.ajouterLog(`Nouvelle partie au niveau ${data.level}.`, true);
              break;
            case 'JOUEUR_REJOINT':
              this.ajouterLog(`${data.pseudo} ${data.retour ? 'est revenu' : 'a rejoint la partie'}.`, true);
              break;
            case 'JOUEUR_QUITTE':
              this.ajouterLog(`${data.pseudo} s'est déconnecté.`, true);
              break;
          }
        },
        // Nouvelle partie annoncée alors qu'on attendait
        annoncerNouvellePartie: function() {
          if (this.sonActif) { Sons.jouer('zone', true); vibrer([60, 50, 120]); }
          if (this.rejoindreAuto) {
            this.rejoindreProchaine();
          } else {
            this.partieDisponible = true;
            this.actif_tab = 'config';
          }
        },
        rejoindreProchaine: function() {
          this.partieDisponible = false;
          this.envoyerHote({ action: 'REJOINDRE', pseudo: monPseudo, clientId: clientId });
        },
        // État complet envoyé par l'hôte à la connexion (ou à la reconnexion)
        appliquerEtat: function(data) {
          if (this.enAttentePartie) {
            // On entre enfin dans la partie
            this.enAttentePartie = false;
            this.partieDisponible = false;
            this.actif_tab = 'play';
            this.ajouterLog('Tu rejoins la nouvelle partie !', true);
          }
          var memePartie = this.partieId === data.partieId && this.grilleLevel === data.level;
          var lancerLocal = this.lancerId;
          if (!memePartie) {
            this.partieId = data.partieId;
            this.level = data.level;
            this.buildGrid();
          }
          this.dice1 = data.dice1;
          this.dice2 = data.dice2;
          this.last_player = data.last_player;
          this.lancerId = data.lancerId;
          this.scores = data.scores;
          this.prisIndex = data.prisIndex;
          this.lancerResolu = data.lancerResolu;
          this.prochainLanceur = data.prochainLanceur;
          this.mesGains = Object.assign({}, data.gains || {});
          if (data.joueurs) this.joueurs = data.joueurs;
          if (data.fin) { if (!this.finPartie) this.finMasquee = false; this.finPartie = data.fin; }
          else this.finPartie = null;

          var resolu = data.lancerId === 0 || data.lancerResolu === data.lancerId;
          if (this.phase !== 'jeu') {
            this.aJoue = true;
          } else if (!memePartie || lancerLocal !== data.lancerId) {
            // Des lancers ont eu lieu pendant l'absence : on peut encore jouer le lancer en cours
            this.aJoue = resolu;
            this.dernierCoup = null;
            this.mesCompletions = [];
          }
          if (resolu) this.dernierCoup = null;

          // On renvoie à l'hôte où on en est (départ validé, coup du lancer en cours)
          if (this.phase === 'jeu') this.signalerPret(true);
          if (this.phase === 'jeu' && this.lancerId > 0 && !resolu) this.signalerJoue();
          if (lancerLocal || memePartie) this.ajouterLog('Reconnecté au salon.', true);
        },

        // ---------- Hôte ----------
        creerPartie: function(reprise) {
          if (!reprise && !this.validerPseudo()) return;

          var customChannel = reprise ? this.roomCode : this.channelInput.trim();
          if (!customChannel) customChannel = 'salon-' + nouvelId().slice(0, 4); // nom par défaut
          this.reinitialiserPeer(!!reprise);
          this.connexion = reprise ? 'perdue' : 'connexion';
          this.status = reprise ? 'Statut : Récupération du salon…' : 'Statut : Création du salon...';
          var monPeer = peer = new Peer(ACCES.idSalon(customChannel));

          monPeer.on('open', (id) => {
            if (peer !== monPeer) return;
            isHost = true;
            this.role = 'hote';
            this.connexion = 'ok';
            this.roomCode = customChannel; // on affiche le nom choisi, pas l'identifiant réseau
            this.status = `Statut : Hôte (${monPseudo})`;
            if (reprise) {
              this.ajouterLog('Salon récupéré, les joueurs vont se reconnecter.', true);
            } else {
              this.actif_tab = 'play';
              this.partieId = nouvelId();
              salle = { ordre: [monPseudo], infos: {}, gains: {}, attente: {} };
              this.buildGrid();
              this.ajouterLog(`${monPseudo} a créé la partie.`, true);
            }
            this.majJoueurs();
          });

          monPeer.on('connection', (conn) => this.brancherClient(conn));

          monPeer.on('disconnected', () => {
            // Serveur de mise en relation perdu : on s'y réinscrit (les parties en cours continuent)
            if (peer === monPeer && !monPeer.destroyed) {
              setTimeout(() => { try { if (monPeer.disconnected && !monPeer.destroyed) monPeer.reconnect(); } catch (e) {} }, 1000);
            }
          });

          monPeer.on('error', (err) => {
            if (peer !== monPeer) return;
            if (reprise || this.role === 'hote') {
              // Après un rechargement, l'ancien identifiant du salon peut rester réservé quelques
              // secondes sur le serveur de mise en relation : on réessaie jusqu'à le récupérer.
              if (err.type === 'peer-unavailable') return; // un joueur injoignable : sans gravité
              this.connexion = 'perdue';
              this.status = 'Statut : Récupération du salon… (nouvelle tentative)';
              this.planifierReconnexion(3000);
              return;
            }
            this.status = 'Statut : Non connecté';
            this.reinitialiserPeer(false);
            if (err.type === 'unavailable-id') {
              alert('Ce nom de salon est déjà utilisé. Choisis-en un autre.');
            } else {
              alert('Erreur : ' + err.message);
            }
          });
        },
        brancherClient: function(conn) {
          connections.push(conn);
          conn.dernierMsg = Date.now();
          conn.on('data', (data) => {
            conn.dernierMsg = Date.now();
            this.recevoirDeClient(conn, data);
          });
          conn.on('close', () => this.perteClient(conn));
          conn.on('error', () => this.perteClient(conn));
        },
        etatPour: function(pseudo) {
          var i = salle.infos[pseudo] || {};
          return {
            action: 'ETAT', level: this.level, partieId: this.partieId,
            lancerId: this.lancerId, dice1: this.dice1, dice2: this.dice2, last_player: this.last_player,
            scores: this.scores, prisIndex: this.prisIndex, lancerResolu: this.lancerResolu,
            prochainLanceur: this.prochainLanceur, fin: this.finPartie, joueurs: this.joueurs,
            gains: salle.gains[pseudo] || {}, vous: { pret: !!i.pret, aJoue: i.aJoue !== false }
          };
        },
        recevoirDeClient: function(conn, data) {
          var p = conn.joueurPseudo;
          var info = p ? salle.infos[p] : null;
          switch (data.action) {
            case 'PING': break;
            case 'REJOINDRE': {
              var pseudo = data.pseudo;
              var existant = salle.infos[pseudo];
              if (pseudo === monPseudo || (existant && existant.connecte && existant.clientId !== data.clientId
                                           && connParPseudo[pseudo] && connParPseudo[pseudo] !== conn)) {
                try { conn.send({ action: 'REFUS', fatal: true, message: 'Ce pseudo est déjà utilisé dans ce salon.' }); } catch (e) {}
                setTimeout(() => { try { conn.close(); } catch (e) {} }, 500);
                return;
              }
              // Partie déjà lancée : un nouveau venu attend la prochaine partie
              if (!existant && this.lancerId > 0) {
                salle.attente = salle.attente || {};
                var dejaEnAttente = pseudo in salle.attente;
                salle.attente[pseudo] = data.clientId;
                conn.attentePseudo = pseudo;
                try {
                  conn.send({ action: 'ATTENTE', level: this.level, lancerId: this.lancerId,
                              fin: !!this.finPartie, joueurs: this.joueurs, scores: this.scores });
                } catch (e) {}
                if (!dejaEnAttente) this.ajouterLog(`${pseudo} attend la prochaine partie.`, true);
                this.majJoueurs();
                return;
              }
              if (salle.attente && pseudo in salle.attente) { delete salle.attente[pseudo]; }
              // Un joueur qui revient remplace son ancienne connexion
              var ancienne = connParPseudo[pseudo];
              if (ancienne && ancienne !== conn) {
                ancienne._remplacee = true;
                connections = connections.filter(c => c !== ancienne);
                try { ancienne.close(); } catch (e) {}
              }
              conn.joueurPseudo = pseudo;
              connParPseudo[pseudo] = conn;
              var retour = !!existant;
              if (!existant) {
                salle.infos[pseudo] = { pret: false, aJoue: true, completions: [], connecte: true,
                                        patienceLevee: false, clientId: data.clientId };
                salle.ordre.push(pseudo);
              } else {
                existant.connecte = true;
                existant.patienceLevee = false;
                existant.clientId = data.clientId;
              }
              this.majJoueurs();
              try { conn.send(this.etatPour(pseudo)); } catch (e) {}
              this.broadcast({ action: 'JOUEUR_REJOINT', pseudo: pseudo, retour: retour });
              this.ajouterLog(`${pseudo} ${retour ? 'est revenu' : 'a rejoint la partie'}.`, true);
              break;
            }
            case 'PRET':
              if (!info) return;
              info.pret = data.pret;
              if (data.pret) this.ajouterLog(`${p} a validé son départ.`, true);
              this.majJoueurs();
              break;
            case 'JOUE':
              // On ignore les messages d'un lancer déjà décompté
              if (!info || data.lancerId !== this.lancerId || this.lancerResolu === this.lancerId) return;
              info.aJoue = data.joue;
              info.completions = data.joue ? (data.zones || []) : [];
              this.majJoueurs();
              this.verifierResolution();
              break;
            case 'DEMANDE_LANCER': {
              if (!info) return; // pas (encore) joueur de cette partie
              var refus = this.refusLancer(p);
              if (refus) { try { conn.send({ action: 'REFUS', message: refus }); } catch (e) {} }
              else this.traiterLancer(p);
              break;
            }
          }
        },
        perteClient: function(conn) {
          if (conn._perdue) return;
          conn._perdue = true;
          connections = connections.filter(c => c !== conn);
          if (conn.attentePseudo && salle.attente && salle.attente[conn.attentePseudo] !== undefined) {
            delete salle.attente[conn.attentePseudo];
            this.majJoueurs();
            return;
          }
          var p = conn.joueurPseudo;
          // Si le joueur s'est déjà reconnecté par une autre connexion, rien à faire
          if (!p || conn._remplacee || connParPseudo[p] !== conn) return;
          delete connParPseudo[p];
          if (salle.infos[p]) salle.infos[p].connecte = false;
          this.broadcast({ action: 'JOUEUR_QUITTE', pseudo: p });
          this.ajouterLog(`${p} s'est déconnecté (il peut revenir).`, true);
          this.majJoueurs();
          this.verifierResolution();
        },

        // ---------- Surveillance de la connexion ----------
        // Toutes les 4 s : petit message "PING" pour garder le lien et détecter les coupures
        // (un téléphone mis en veille ne prévient pas toujours qu'il est parti).
        battement: function() {
          var maintenant = Date.now();
          if (this.role === 'hote' && peer) {
            connections.slice().forEach(c => {
              try { if (c.open) c.send({ action: 'PING' }); } catch (e) {}
              if (maintenant - (c.dernierMsg || maintenant) > DELAI_SILENCE) {
                try { c.close(); } catch (e) {}
                this.perteClient(c);
              }
            });
            if (peer.destroyed) this.planifierReconnexion(500);
            else if (peer.disconnected) { try { peer.reconnect(); } catch (e) {} }
          } else if (this.role === 'client' && this.connexion === 'ok') {
            this.envoyerHote({ action: 'PING' });
            if (maintenant - dernierMsgHote > DELAI_SILENCE) this.perteHote();
          }
        },
        // Retour au premier plan (écran rallumé, onglet réaffiché) : on vérifie tout de suite
        auRetourPremierPlan: function() {
          this.majVeille();
          if (document.visibilityState === 'hidden' || !this.role) return;
          if (this.role === 'hote') {
            if (!peer || peer.destroyed) this.creerPartie(true);
            else if (peer.disconnected) { try { peer.reconnect(); } catch (e) {} }
          } else if (this.connexion !== 'ok' || Date.now() - dernierMsgHote > 8000) {
            this.connexion = 'perdue';
            this.rejoindrePartie(true);
          }
        },

        // ---------- Restauration au chargement de la page ----------
        restaurer: function() {
          var sv = lireStockage(CLE_SAUVEGARDE);
          if (!sv) return;
          this.pseudoInput = sv.pseudo || '';
          if (sv.salon) this.channelInput = sv.salon;
          monPseudo = (sv.pseudo || '').trim();

          this.level = sv.level || 1;
          this.buildGrid();
          Object.keys(sv.cells || {}).forEach(k => {
            if (this.cellsData[k]) {
              this.cellsData[k].label = sv.cells[k][0];
              this.cellsData[k].depart = !!sv.cells[k][1];
            }
          });
          ['soloTraits', 'soloPenalite', 'enAttentePartie', 'infoAttente', 'partieId', 'phase', 'lancerId', 'aJoue', 'dernierCoup', 'mesCompletions', 'mesGains',
           'dice1', 'dice2', 'last_player', 'scores', 'prisIndex', 'lancerResolu', 'prochainLanceur',
           'finPartie', 'finMasquee', 'joueurs', 'historique'].forEach(cle => {
            if (sv[cle] !== undefined) this[cle] = sv[cle];
          });

          if (sv.role && sv.salon) {
            this.role = sv.role;
            this.roomCode = sv.salon;
            this.actif_tab = 'play';
            this.connexion = 'perdue';
            if (sv.role === 'hote' && sv.salle) {
              salle = sv.salle;
              // Tous les joueurs sont considérés absents jusqu'à ce qu'ils se reconnectent
              Object.values(salle.infos).forEach(i => { i.connecte = false; });
            }
            this.ajouterLog('Partie restaurée, reconnexion au salon…', true);
            if (sv.role === 'hote') this.creerPartie(true);
            else this.rejoindrePartie(true);
          }
        },

        afficherResultat: function(joueur, valeur, lancerId, prochain) {
          this.last_player = joueur;
          this.dice1 = valeur.dice1;
          this.dice2 = valeur.dice2;
          this.lancerId = lancerId;
          this.prochainLanceur = prochain || null;
          // Nouveau lancer : chacun doit jouer (ou passer)
          this.aJoue = (this.phase !== 'jeu');
          this.dernierCoup = null;
          this.mesCompletions = [];
          this.zoneSurlignee = null;
          this.ajouterLog(`${joueur} a fait un ${valeur.dice1} - ${valeur.dice2}`);
          this.animerDes();
        },
        // Dés qui roulent : son, vibration et chiffres qui défilent pendant ~0,6 s
        animerDes: function() {
          if (this.sonActif) { Sons.jouer('des'); vibrer([25, 35, 25, 45, 20, 70, 15]); }
          clearInterval(this._timerDes);
          this.desRoulent = true;
          var debut = Date.now();
          this._timerDes = setInterval(() => {
            this.desAnim = [1 + Math.floor(Math.random() * 6), 1 + Math.floor(Math.random() * 6)];
            if (Date.now() - debut > 600) { clearInterval(this._timerDes); this.desRoulent = false; }
          }, 70);
        },
        annoncerLanceur: function() {
          if (!this.voixActive || !this.voixSupportee) return;
          var cle = this.cleAnnonce;
          if (!cle || this._derniereAnnonce === cle) return; // une seule annonce par lancer
          this._derniereAnnonce = cle;
          // Seul le téléphone concerné parle (sinon, dans la même pièce, tout le monde parle en même temps).
          // Quand n'importe qui peut lancer (début de partie, lanceur absent), c'est l'hôte qui l'annonce.
          var nom = this.prochainLanceur, moi = this.monPseudoAffiche, texte;
          if (nom && !this.prochainAbsent) {
            if (nom !== moi) return;
            texte = nom + ', à toi de lancer !';
          } else {
            if (this.role !== 'hote') return;
            texte = nom ? nom + ' est absent. N\'importe qui peut lancer.' : 'Tout le monde est prêt. Lancez les dés !';
          }
          // Rappel seulement si personne n'a lancé au bout de 5 s : la clé change dès qu'un lancer a lieu,
          // et l'annonce est alors abandonnée (pas de bavardage quand le joueur est attentif).
          clearTimeout(this._timerVoix);
          this._timerVoix = setTimeout(() => { if (this.cleAnnonce === cle) Voix.dire(texte); }, DELAI_ANNONCE);
        },
        basculerSon: function() {
          this.sonActif = !this.sonActif;
          if (this.sonActif) { Sons.jouer('zone', true); vibrer(40); }
          this.afficherMessage(this.sonActif ? '🔊 Sons et vibrations activés.' : '🔇 Sons et vibrations coupés.');
        },

        // Choix du niveau (accueil) : en cours de partie, on demande confirmation
        changerNiveau: function(n) {
          if (n === this.level || this.role === 'client') return;
          var enCours = this.phase === 'jeu' || this.lancerId > 0 ||
                        Object.values(this.cellsData).some(c => c.label);
          var msg = this.role === 'hote'
            ? 'Changer de niveau recommence la partie pour tous les joueurs. Continuer ?'
            : 'Changer de niveau efface ta grille. Continuer ?';
          if (enCours && !confirm(msg)) return;
          this.level = n;
        },
        // ---------- Écran toujours allumé (Screen Wake Lock) ----------
        // Actif dès qu'on est dans un salon (quel que soit l'onglet, pour ne pas perdre la connexion),
        // ou pendant une partie solo commencée, sur l'onglet Jouer.
        // Le navigateur relâche le verrou quand l'appli passe en arrière-plan : on le reprend au retour.
        veilleVoulue: function() {
          if (!this.veilleSupportee || !this.garderEcran || document.visibilityState !== 'visible') return false;
          return !!this.role || (this.phase === 'jeu' && this.actif_tab === 'play');
        },
        majVeille: function() {
          if (!this.veilleSupportee) return;
          if (this.veilleVoulue()) {
            if (this._verrou || this._demandeVerrou) return;
            this._demandeVerrou = true;
            navigator.wakeLock.request('screen').then(verrou => {
              this._demandeVerrou = false;
              if (!this.veilleVoulue()) { verrou.release(); return; }
              this._verrou = verrou;
              this.veilleActive = true;
              verrou.addEventListener('release', () => {
                if (this._verrou === verrou) { this._verrou = null; this.veilleActive = false; }
              });
            }).catch(() => {
              // Refusé (souvent : il faut un geste de l'utilisateur) -> on réessaie au prochain toucher
              this._demandeVerrou = false;
              if (!this._attenteGeste) {
                this._attenteGeste = () => {
                  document.removeEventListener('pointerup', this._attenteGeste);
                  this._attenteGeste = null;
                  this.majVeille();
                };
                document.addEventListener('pointerup', this._attenteGeste);
              }
            });
          } else if (this._verrou) {
            var v = this._verrou;
            this._verrou = null;
            this.veilleActive = false;
            v.release().catch(() => {});
          }
        },
        basculerVeille: function() {
          this.garderEcran = !this.garderEcran;
          this.afficherMessage(this.garderEcran ? '☀️ L\'écran restera allumé pendant la partie.'
                                                : '🌙 L\'écran se mettra en veille normalement.');
        },
        // ---------- Accès privé ----------
        validerAcces: function() {
          if (this.accesEnCours || !this.codeSaisi.trim()) return;
          this.accesEnCours = true;
          this.accesErreur = '';
          ACCES.valider(this.codeSaisi).then(ok => {
            this.accesEnCours = false;
            if (!ok) { this.accesErreur = 'Code incorrect.'; return; }
            this.codeSaisi = '';
            this.accesOk = true;
            this.restaurer();
          }).catch(() => {
            this.accesEnCours = false;
            this.accesErreur = 'Ce navigateur ne permet pas de vérifier le code.';
          });
        },
        installer: function() {
          var invit = this._invitationInstall;
          if (!invit) return;
          invit.prompt();
          invit.userChoice.then(() => { this._invitationInstall = null; this.installPossible = false; });
        },
        setTab: function(tab) {
          this.actif_tab = tab;
        },

        // ---------- Picker ----------
        toggleCell: function(cell, event) {
          var pickerWidth = 150;
          var pickerHeight = 110;

          var gridRect = event.currentTarget.parentElement.getBoundingClientRect();

          var posX = (event.clientX > gridRect.left + gridRect.width / 2)
            ? event.clientX - pickerWidth - 10
            : event.clientX + 10;

          var posY = (event.clientY > gridRect.top + gridRect.height / 2)
            ? event.clientY - pickerHeight - 10
            : event.clientY + 10;

          var data = this.cellsData[cell.key];

          if (this.phase === 'depart') {
            // Retoucher un chiffre de départ l'efface
            if (data.depart) { data.label = ''; data.depart = false; return; }
            if (data.label) return;
            if (this.zoneADejaUnDepart(cell.zone)) {
              this.zoneSurlignee = cell.zone;
              return this.afficherMessage('Cette zone a déjà un chiffre de départ.');
            }
          } else {
            this.zoneSurlignee = cell.zone;
            // Solo : la pénalité se choisit avant d'inscrire son chiffre (toucher une case choisit sa zone)
            if (this.modeSolo && this.soloPenalite) return;
            // Case déjà remplie, pas de lancer, ou coup déjà joué : on montre juste la zone
            if (data.label) return;
            if (this.dice1 === null) return this.afficherMessage('Attends le premier lancer de dés.');
            if (this.aJoue) return this.afficherMessage('Tu as déjà joué ce lancer.');
            if (!this.coupsPossibles[cell.key]) return this.afficherMessage(this.raisonInterdit(cell.key));
          }

          this.picker = { show: true, key: cell.key, x: posX, y: posY };
          this.zoneSurlignee = cell.zone;
          this.cellsData[cell.key].selected = true;
        },

        selectNumber: function(number) {
          if (!this.picker.key) return;
          var c = this.cellsData[this.picker.key];
          if (this.phase === 'jeu') {
            // Sécurité : on revérifie que le coup est légal
            var legaux = this.coupsPossibles[this.picker.key] || [];
            if (legaux.indexOf(number) === -1) return this.closePicker();
            this.dernierCoup = this.picker.key;
            this.aJoue = true;
          }
          c.label = number;
          c.depart = (this.phase === 'depart');
          this.zoneSurlignee = null;
          this.closePicker();
          if (this.phase === 'jeu') {
            // Ce coup complète-t-il la zone ? (décomptée quand tout le monde aura joué)
            this.mesCompletions = this.zoneEstPleine(c.zone) ? [c.zone] : [];
            if (this.mesCompletions.length) this.afficherMessage('Zone complétée ! Les points arrivent quand tout le monde a joué.');
            this.signalerJoue();
          }
        },
        closePicker: function() {
          if (this.picker.key && this.cellsData[this.picker.key]) {
            this.cellsData[this.picker.key].selected = false;
          }
          this.picker.show = false;
          this.picker.key = null;
        },

        // ---------- Dés ----------
        rollDice: function() {
          if (this.phase === 'depart') {
            return this.afficherMessage('Termine d\'abord ton placement de départ.');
          }
          if (!this.role) {
            // Hors ligne (solo) : on lance localement
            if (!this.aJoue) return this.afficherMessage('Joue ou passe avant de relancer.');
            if (this.soloPenalite) return this.afficherMessage('Choisis d\'abord la zone à pénaliser.');
            if (this.soloTraits >= SOLO_LANCERS) return this.afficherMessage('Les ' + SOLO_LANCERS + ' lancers sont joués.');
            monPseudo = this.pseudoInput.trim() || 'Moi';
            this.traiterLancer(monPseudo);
            return this.soloApresLancer();
          }
          if (this.finPartie) return this.afficherMessage('La partie est terminée.');
          if (isHost) {
            var refus = this.refusLancer(monPseudo);
            if (refus) return this.afficherMessage(refus);
            this.traiterLancer(monPseudo);
          } else if (this.connexion === 'ok') {
            this.envoyerHote({ action: 'DEMANDE_LANCER', pseudo: monPseudo });
          } else {
            this.afficherMessage('Connexion perdue : reconnexion en cours…');
          }
        },
        traiterLancer: function(joueur) {
          const val = {
            dice1: Math.floor(Math.random() * 6) + 1,
            dice2: Math.floor(Math.random() * 6) + 1
          };
          // Le suivant dans l'ordre des joueurs (sens horaire = ordre d'arrivée), en sautant les absents
          var prochain = null;
          if (this.role === 'hote') {
            var ordre = salle.ordre;
            var idx = ordre.indexOf(joueur);
            for (var k = 1; k <= ordre.length; k++) {
              var cand = ordre[(idx + k) % ordre.length];
              if (this.estConnecte(cand)) { prochain = cand; break; }
            }
          }
          var lancerId = this.lancerId + 1;

          Object.values(salle.infos).forEach(i => { i.aJoue = false; i.completions = []; });
          this.afficherResultat(joueur, val, lancerId, prochain);
          this.broadcast({ action: 'RESULTAT', joueur: joueur, valeur: val, lancerId: lancerId, prochainLanceur: prochain });
          this.majJoueurs();
        }
      }
    });
  </script>

  <script>
    // Service worker : mise en cache pour l'application installée
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (e) { console.warn('Service worker :', e); });
      });
    }
  </script>
