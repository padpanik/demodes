<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grille Vue 2 avec Couleurs Initiales</title>
  <!-- <script src="vue.global.js"></script> -->
  <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>  
  <style>
    #menu {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
    }

    #menu div {
      border: 1px solid;
      padding: 10px 30px;
      border-radius: 5px;
      background-color: #2c3e50;
      color: white;
      cursor: pointer;

      &.actif {
        background-color: #3387d0 !important;
      }

    }


    #config {

      font-family: system-ui, sans-serif; width: 100%; text-align: center; 

      .card { border: 1px solid #ccc; padding: 1.5rem; border-radius: 8px; margin-bottom: 1rem; background: #f9f9f9; }
      button { padding: 0.6rem 1.2rem; font-size: 1rem; cursor: pointer; border-radius: 4px; border: 1px solid #999; }
      input { padding: 0.6rem; font-size: 1rem; width: 80%; margin-bottom: 0.8rem; box-sizing: border-box; }
      #de { font-size: 4rem; margin: 1rem 0; font-weight: bold; height: 5rem; line-height: 5rem; }
      .status { font-weight: bold; color: #555; }
      ul { text-align: left; background: #fff; border: 1px solid #ddd; padding: 1rem 2rem; border-radius: 4px; max-height: 150px; overflow-y: auto; }
      .sys-msg { font-style: italic; color: #666; }
    }

    .grid-app {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center; /* Centre la grille et les contrôles */
      width: 100%;
      max-width: 600px;
      height: 100vh; 
      margin: 0 auto;
      padding: 16px;
      box-sizing: border-box;
    }

    .grid-app .controls {
      width: 100%;
      margin-bottom: 16px;
      text-align: center;
    }

    .grid-app .controls input {
      width: 60px;
      padding: 4px;
    }

    .grid-app .grid-container {
      display: grid;
      width: min(90vw, calc(100vh - 420px));  /* Limite en largeur (90vw) OU en hauteur restante */
      height: min(90vw, calc(100vh - 420px)); 
      gap: 4px;
      background-color: #f0f0f0;
      padding: 8px;
      border-radius: 8px;
      box-sizing: border-box;
    }

    .grid-app .cell {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      border: 1px solid #ccc;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      font-weight: bold;
      box-sizing: border-box;
      container-type: inline-size;
      font-size: 2em;
    }

    .grid-app .cell:hover {
      opacity: 0.8;
      border-color: #000;
    }

    .grid-app .cell.is-selected {
      border: 2px solid #000;
      box-shadow: 0 0 5px rgba(0,0,0,0.3);
      opacity: 0.50;
    }

    .picker-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 999;
    }

    /* Le pavé 2x3 positionné près de la souris */
    .picker-box {
      position: fixed;
      z-index: 1000;
      background-color: #ffffff;
      padding: 8px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
      display: grid;
      grid-template-columns: repeat(3, 40px);
      gap: 6px;
    }

    /* Boutons ajustés */
    .picker-box button {
      width: 40px;
      height: 40px;
      font-size: 22px;
      font-weight: bold;
      color: #333;
      background-color: #f8f9fa;
      border: 1px solid #ced4da;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
    }

    .picker-box button:hover {
      background-color: #42b983;
      color: #ffffff;
      border-color: #42b983;
      transform: scale(1.08);
    }

    .num_inactif {
      color: #b1b1b1 !important;
    }


    /* Section dés centrée sous la grille */
    .dice-section {
      width: 100%;
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .dice-container {
      display: flex;
      gap: 16px;
    }

    /* Style d'un dé */
    .dice {
      width: 60px;
      height: 60px;
      background-color: #ffffff;
      border: 2px solid #2c3e50;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
      font-weight: bold;
      color: #2c3e50;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      user-select: none;
    }

    /* Bouton de lancer */
    .roll-btn {
      margin-top: 30px;
      padding: 20px 40px;
      font-size: 26px;
      font-weight: bold;
      color: #ffffff;
      background-color: #2c3e50;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .roll-btn:hover {
      background-color: #34495e;
    }

    .roll-btn:active {
      transform: scale(0.96);
    }


  </style>
</head>
<body>



  <div id="app" class="grid-app">

    <!-- MENU -->
    <div id="menu">
      <div @click="setTab('config')" :class="{actif:actif_tab=='config'}">Config</div>
      <div @click="setTab('play')" :class="{actif:actif_tab=='play'}">Jouer</div>
    </div>

    <!-- CONFIG -->
    <div v-show='actif_tab=="config"' id="config">
      <!-- Zone de Configuration -->
      <div class="card" id="setupCard">

        <label for="size-input" style="font-size: 1.5em;">{{ pseudoInput }} Niveau : </label>
        <select id="level-input" v-model.number="level"  style="font-size: 1.5em; margin-bottom: 20px;">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
        </select>

        <input type="text" id="pseudoInput" v-model='pseudoInput' placeholder="Ton pseudo (ex: Alex)" required><br>
        <input type="text" id="channelInput" v-model='channelInput' placeholder="Nom/ID du salon (ex: ma-partie-des)"><br><br>
        


        <button @click="creerPartie()">Créer ce salon (Hôte)</button>
        <p>— ou —</p>
        <button @click="rejoindrePartie()">Rejoindre ce salon</button>
      </div>

      <!-- Zone de Statut -->
      <div class="card" id="statusCard">
        <p class="status" id="status" v-html="status"></p>
        <p id="roomCode" v-html="roomCode"></p>
      </div>

      <!-- Historique -->
      <h3>Activité</h3>
      <ul id="historique" v-html="historique"></ul>    

    </div>

    <!-- PLAY -->
    <div v-show='actif_tab=="play"' id="play">

      <div 
        class="grid-container"
        :style="{
          'grid-template-columns': 'repeat(' + size + ', 1fr)',
          'grid-template-rows': 'repeat(' + size + ', 1fr)'
        }"
      >
        <!-- Cell -->
        <div
          v-for="cell in getGrid()"
          :key="cell.id"
          class="cell"
          :class="{ 'is-selected': cell.selected }"
          :style="{ backgroundColor: cell.color }"
          @click="toggleCell(cell, $event)"
        >
          {{ cell.label }}
        </div>

        <!-- Zone invisible pour fermer le picker si on clique à côté -->
        <div v-if="picker.show" class="picker-backdrop" @click="closePicker"></div>

        <!-- Picker positionné sous le curseur -->
        <div v-if="picker.show" class="picker-box" :style="{ top: picker.y + 10 + 'px', left: picker.x + 10 + 'px'}">
          <button v-for="num in 6" :key="num" @click="selectNumber(num)" :class="{num_inactif:num != dice1 && num != dice2}">{{ num }}</button>
        </div>
      </div>


      <!-- Bloc Lanceur de Dés -->
      <div class="dice-section">
        <div class="dice-lanceur">{{ last_player }}</div>

        <div class="dice-container">
          <div class="dice">{{ dice1 !== null ? dice1 : '?' }}</div>
          <div class="dice">{{ dice2 !== null ? dice2 : '?' }}</div>
        </div>
        
        <button class="roll-btn" @click="rollDice">
          🎲 Lancer les dés
        </button>
      </div>
    </div>

  </div>

  <script>
    let palette = {
      B: '#3498db',
      V: '#2ecc71',
      J: '#f1c40f',
      R: '#e74c3c',
      M: '#9b59b6',
      O: '#f9a852',
      G: '#aaaaaa',
    };

    let grille = {
      level_1: [
        ['J','V','B','M','M','M','J'],
        ['V','V','B','B','M','M','V'],
        ['V','R','R','B','M','V','V'],
        ['V','R','M','J','V','V','V'],
        ['V','R','M','M','R','R','B'],
        ['R','R','M','R','R','B','B'],
        ['J','M','M','R','R','B','J'],
      ],
      level_2: [
        ['M','M','M','G','V','V','V'],
        ['M','J','B','B','B','J','V'],
        ['M','R','R','B','B','R','V'],
        ['R','R','R','J','R','R','R'],
        ['V','R','B','B','R','R','M'],
        ['V','J','B','B','B','J','M'],
        ['V','V','V','G','M','M','M'],
      ],
      level_3: [
        ['J','J','M','G','M','J','J'],
        ['G','J','M','M','M','J','G'],
        ['R','R','R','M','R','R','R'],
        ['R','R','R','J','R','R','R'],
        ['V','B','B','B','B','B','V'],
        ['V','V','V','V','V','V','V'],
        ['M','M','M','G','M','M','M'],
      ],
      level_4: [
        ['O','O','O','O','O','O','O'],
        ['J','R','B','V','B','R','J'],
        ['R','R','M','M','M','R','R'],
        ['J','V','B','M','B','V','J'],
        ['R','R','M','M','M','R','R'],
        ['J','R','B','V','B','R','J'],
        ['O','O','O','O','O','O','O'],
      ],
    };

    let peer = null;
    let connections = []; // Pour l'hôte
    let hostConn = null;  // Pour les clients
    let isHost = false;
    let monPseudo = '';


    async function activerWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
          wakelockStatusEl.style.display = 'block';
          console.log('Wake Lock actif : l\'écran ne s\'éteindra pas.');

          wakeLock.addEventListener('release', () => {
            console.log('Wake Lock relâché.');
          });
        }
      } catch (err) {
        console.warn(`Wake Lock non disponible ou refusé : ${err.message}`);
      }
    }

    new Vue({
      el: '#app',
      data: {
        actif_tab: 'config',
        pseudoInput: '',
        channelInput: 'toto',
        historique: '',        
        roomCode: '',
        status: 'Statut : Connexion...',
        size: 7,
        level: 1,
        curentLevel: 0,
        last_player: '',
        dice1: null,
        dice2: null,        
        picker: {
          show: false,
          key: null,
          x: 0,
          y: 0
        },      
        cellsData: {
        }
      },
      created: function() {

      },
      computed: {

      },
      methods: {
        ajouterLog: function(msg, isSystem = false) {
          const li = document.createElement('li');
          li.innerText = msg;
          if (isSystem) li.className = 'sys-msg';
          this.historique += li.outerHTML;
        },
        broadcast: function (data) {
          connections.forEach(c => c.send(data));
        },
        validerPseudo: function() {
          monPseudo = this.pseudoInput.trim();
          if (!monPseudo) {
            alert('Merci de saisir un pseudo.');
            return false; 
          }
          return true;
        },
        rejoindrePartie: function() {
          if (!this.validerPseudo()) return;

          const targetChannel = this.channelInput.trim();
          if (!targetChannel) return alert('Saisis le nom du salon à rejoindre.');

          isHost = false;
          peer = new Peer();

          peer.on('open', () => {
            hostConn = peer.connect(targetChannel);

            hostConn.on('open', () => {
              this.actif_tab = 'play';
              this.status = `Statut : Connecté (${monPseudo})`;
              this.roomCodeEl = `Salon : <strong>${targetChannel}</strong>`;

              // Envoyer notre pseudo à l'hôte
              hostConn.send({ action: 'REJOINDRE', pseudo: monPseudo });
            });

            hostConn.on('data', (data) => {
              if (data.action === 'RESULTAT') {
                this.afficherResultat(data.joueur, data.valeur);
              } 
              else if (data.action === 'JOUEUR_REJOINT') {
                this.ajouterLog(`${data.pseudo} a rejoint la partie.`, true);
              }
              else if (data.action === 'JOUEUR_QUITTE') {
                this.ajouterLog(`${data.pseudo} a quitté la partie.`, true);
              }
            });

            hostConn.on('close', () => {
              this.status = 'Statut : Déconnecté';
              this.ajouterLog('Connexion au salon perdue.', true);
            });
          });

          peer.on('error', (err) => {
            alert('Impossible de trouver ce salon.');
          });
        },

        creerPartie: function() {
          if (!this.validerPseudo()) return;

          const customChannel = this.channelInput.trim();
          
          // Si un nom de salon est fourni, on l'utilise comme ID Peer, sinon ID généré
          peer = customChannel ? new Peer(customChannel) : new Peer();

          peer.on('open', (id) => {
            isHost = true;
            this.actif_tab = 'play';
            this.status = `Statut : Hôte (${monPseudo})`;
            this.roomCodeEl = `Nom du salon : <strong>${id}</strong>`;
            this.ajouterLog(`${monPseudo} a créé la partie.`, true);
          });

          peer.on('connection', (conn) => {
            connections.push(conn);

            conn.on('data', (data) => {
              if (data.action === 'REJOINDRE') {
                conn.joueurPseudo = data.pseudo;
                // Alerte l'hôte et redistribue l'info à tous les clients
                this.broadcast({ action: 'JOUEUR_REJOINT', pseudo: data.pseudo });
                this.ajouterLog(`${data.pseudo} a rejoint la partie.`, true);
              }
              else if (data.action === 'DEMANDE_LANCER') {
                this.traiterLancer(data.pseudo);
              }
            });

            conn.on('close', () => {
              const pseudoQuitte = conn.joueurPseudo || 'Un joueur';
              connections = connections.filter(c => c !== conn);
              this.broadcast({ action: 'JOUEUR_QUITTE', pseudo: pseudoQuitte });
              this.ajouterLog(`${pseudoQuitte} a quitté la partie.`, true);
            });
          });

          peer.on('error', (err) => {
            if (err.type === 'unavailable-id') {
              alert('Ce nom de salon est déjà utilisé. Choisis-en un autre.');
            } else {
              alert('Erreur : ' + err.message);
            }
          });
        },

        afficherResultat: function(joueur, valeur) {
          this.last_player = joueur;
          this.dice1 = valeur.dice1;
          this.dice2 = valeur.dice2;
          this.ajouterLog(`${joueur} a fait un ${valeur.dice1} - ${valeur.dice2}`);
        },

        setTab: function(tab) {
          this.actif_tab = tab;
        },

        getGrid: function() {

          var level = this.level;
          var totalCells = this.size * this.size;
          var result = [];

          if(this.curentLevel != this.level) {
            for(let lig = 0; lig < this.size; lig++) {
              for(let col = 0; col < this.size; col++) {
                this.cellsData[lig+'-'+col] = { color: palette[grille['level_'+this.level][col][lig]] };
              }
            }            
            this.curentLevel = this.level;
          }

          for (var index = 0; index < totalCells; index++) {
            var x = index % this.size;
            var y = Math.floor(index / this.size);
            var key = x + '-' + y;

            var existingData = this.cellsData[key] || {};

            result.push({
              id: index,
              x: x,
              y: y,
              selected: existingData.selected || false,
              color: existingData.color || '#ffffff',
              label: existingData.label || ''
            });
          }

          return result;
        },        
        toggleCell: function(cell, event) {
          var pickerWidth = 150;
          var pickerHeight = 110;

          var gridRect = event.currentTarget.parentElement.getBoundingClientRect();
          
          // Affiche à gauche si on dépasse le milieu de la grille
          var posX = (event.clientX > gridRect.left + gridRect.width / 2)
            ? event.clientX - pickerWidth - 10
            : event.clientX + 10;

          // Affiche au-dessus si on est vers le bas de la grille
          var posY = (event.clientY > gridRect.top + gridRect.height / 2)
            ? event.clientY - pickerHeight - 10
            : event.clientY + 10;

          this.picker = {
            show: true,
            key: cell.x + '-' + cell.y,
            x: posX,
            y: posY
          };

          this.cellsData[this.picker.key].selected = true;
          this.cellsData[this.picker.key].label = '';

        },

        // Applique le chiffre choisi
        selectNumber: function(number) {
          if (!this.picker.key) return;
          if (this.dice1 && this.dice2 && number != this.dice1 && number != this.dice2) return;

          var currentState = this.cellsData[this.picker.key] || {};

          this.$set(this.cellsData, this.picker.key, {
            selected: currentState.selected || false,
            color: currentState.color || '#ffffff',
            label: number
          });

          this.closePicker();
        },
        closePicker: function() {
          this.cellsData[this.picker.key].selected = false;
          this.picker.show = false;
          this.picker.key = null;
        },
        rollDice: function() {
          if (isHost) {
            this.traiterLancer(monPseudo);
          } else if (hostConn) {
            hostConn.send({ action: 'DEMANDE_LANCER', pseudo: monPseudo });
          }
        },
        traiterLancer: function(joueur) {
          this.dice1 = Math.floor(Math.random() * 6) + 1;
          this.dice2 = Math.floor(Math.random() * 6) + 1;

          let val = {dice1: this.dice1, dice2: this.dice2};
          const payload = { action: 'RESULTAT', joueur: joueur, valeur: val };

          this.afficherResultat(joueur, val);
          this.broadcast(payload);
        }

      }
    });
  </script>

</body>
</html>
