<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1f5f8b">
  <title>Relevé de tension : nouvelle adresse</title>
  <style>
    body {
      margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #eef3f7; color: #1d2b36; font-size: 16px;
      display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;
      box-sizing: border-box;
    }
    .carte {
      background: #fff; border-radius: 16px; padding: 22px 20px; max-width: 380px; width: 100%;
      box-shadow: 0 1px 4px rgba(0,0,0,.08); text-align: center;
    }
    h1 { font-size: 20px; margin: 0 0 10px; color: #1f5f8b; }
    p { line-height: 1.45; color: #44596a; margin: 0 0 16px; }
    a.bouton {
      display: block; background: #1f5f8b; color: #fff; text-decoration: none; font-weight: 600;
      padding: 14px; border-radius: 12px; font-size: 16px;
    }
    .petit { font-size: 13px; margin: 14px 0 0; }
  </style>
</head>
<body>
  <div class="carte">
    <h1>Le relevé de tension a déménagé</h1>
    <p id="texte">Il a maintenant sa propre adresse, pour ne plus gêner l'appli Désdale sur le téléphone.</p>
    <a class="bouton" id="aller" href="https://tension.desdale.workers.dev/">Ouvrir le relevé</a>
    <p class="petit" id="note"></p>
  </div>
  <script>
    // Ancienne adresse du relevé (dans le site de Désdale) : emporte les relevés vers la nouvelle adresse.
    // Les relevés passent dans le #… du lien : ils ne sont jamais envoyés à un serveur.
    const NOUVELLE = 'https://tension.desdale.workers.dev/';
    let donnees = null;
    try { donnees = JSON.parse(localStorage.getItem('tension-releves')); } catch (e) {}
    const n = donnees && donnees.m ? Object.keys(donnees.m).length : 0;

    // Ancien service worker de cette page : on le retire, avec sa copie gardée
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => {
        if (new URL(r.scope).pathname.indexOf('/tension/') === 0) r.unregister();
      })).catch(() => {});
    }
    if (window.caches) {
      caches.keys().then(noms => noms.filter(x => x.indexOf('tension-') === 0).forEach(x => caches.delete(x))).catch(() => {});
    }

    if (n) {
      const paquet = JSON.stringify({ appli: 'releve-tension', date: Date.now(), donnees: donnees });
      const lien = NOUVELLE + '#import=' + encodeURIComponent(btoa(unescape(encodeURIComponent(paquet))));
      const bouton = document.getElementById('aller');
      bouton.href = lien;
      bouton.textContent = 'Emporter mes ' + n + ' relevé' + (n > 1 ? 's' : '') + ' →';
      document.getElementById('note').textContent = 'Si l\'appli « Tension » était installée depuis cette page, désinstallez-la puis installez-la depuis la nouvelle adresse.';
    } else {
      location.replace(NOUVELLE);
    }
  </script>
</body>
</html>
