    .boite-menu { max-height: calc(100vh - 40px); overflow-y: auto; padding: 14px 12px; }
    .choix-cartes { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin: 10px 0 6px; }

    .choix-cartes .carte-c.vendu { opacity: 0.3; pointer-events: none; }
    .butin-l { display: flex; flex-direction: column; gap: 4px; margin: 8px 0; font-weight: 700; font-size: 0.88em; color: #3b4b57; text-align: left; }
    .butin-l span { background: #f6f8fa; border-radius: 10px; padding: 5px 8px; }
    .ligne-achat { display: flex; align-items: center; gap: 8px; background: #f6f8fa; border-radius: 10px; padding: 6px 8px; margin-top: 6px; text-align: left; font-size: 0.85em; }
    .ligne-achat .ico { font-size: 1.5em; }

    .ligne-achat button { border: none; background: #ffd43b; color: #2a211b; font: inherit; font-weight: 900; border-radius: 9px; padding: 5px 8px; cursor: pointer; white-space: nowrap; }
    .ligne-achat button:disabled { background: #e3e8ec; color: #98a3ab; }

    .paquet-grille { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 5px; margin: 14px 0 6px; }

    .paquet-grille .carte-c.choisie { box-shadow: 0 0 0 3px #ff922b; transform: translateY(-4px); }
    .apercu-plus { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 10px 0; }
    .apercu-plus .carte-c { width: 40%; }
    .or-menu { font-weight: 900; color: #a8590f; }
    .diffs-dj { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 4px; }
    .diffs-dj button { display: flex; flex-direction: column; align-items: center; gap: 1px; border: 2px solid #e3e8ec; background: #fff; font: inherit; border-radius: 12px; padding: 7px 4px; cursor: pointer; color: #2c3e50; }
    .diffs-dj .ico { font-size: 1.35em; line-height: 1.1; }
    .diffs-dj b { font-size: 0.9em; }
    .diffs-dj small { font-size: 0.72em; color: #7f8c8d; font-weight: 700; }
    .diffs-dj button.actif.d-normal { border-color: #2f9e44; background: #ebfbee; }
    .diffs-dj button.actif.d-heroique { border-color: #e8590c; background: #fff4e6; }
    .diffs-dj button.actif.d-mythique { border-color: #7048e8; background: #f3f0ff; }
    .cle-dj { margin-top: 10px; padding: 8px 10px; border-radius: 12px; background: #f3f0ff; border: 1px dashed #b197fc; }
    .titre-cle { font-weight: 900; color: #5f3dc4; }
    .perils { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
    .perils button { border: 2px solid #e3e8ec; background: #fff; font: inherit; font-weight: 900; border-radius: 10px; padding: 4px 10px; cursor: pointer; }
    .perils button.actif { border-color: #7048e8; background: #fff; color: #5f3dc4; }
    .classe-dj { display: inline-block; background: #f3f0ff; color: #5f3dc4; border-radius: 999px; padding: 2px 10px; font-weight: 800; font-size: 0.85em; margin: 2px 0; }


    /* ================== Habillage du donjon (3.14) : pierre sombre, or et parchemin ================== */
    .jeu-dj { background: radial-gradient(ellipse at 50% 0%, #2c211a 0%, #17110d 70%); border-radius: 16px; padding: 8px 6px 10px; color: #f1e6d6; box-shadow: inset 0 0 0 1px #3d2e23; }
    .tete-dj { background: linear-gradient(#3a2c22, #261c15); border: 1px solid #5c4532; border-radius: 12px; padding: 6px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 3px 8px rgba(0,0,0,0.4); }
    .etage-dj { background: #1b130e; color: #ffd8a8; border: 1px solid #8d6a3f; }
    .pv-dj { background: #4a2020; box-shadow: inset 0 1px 3px rgba(0,0,0,0.6); border: 1px solid #120c09; }
    .pv-dj i { background: linear-gradient(#ff8787, #c92a2a 70%, #a61e1e); }
    .or-dj { color: #ffd43b; }
    .objets-dj button { background: #3f3026; color: #f1e6d6; border: 1px solid #5c4532; box-shadow: none; }
    .objets-dj .fiole-vide { border-color: #6b5644; }
    .objets-dj .petit { color: #e9dcc8; }
    .carte-mini span.vue { background: #8d7b68; }
    .carte-mini span.ici { background: #ffa94d; box-shadow: 0 0 4px #ffa94d; }
    .salle-dj { border: 2px solid #4b3a2c; box-shadow: 0 6px 16px rgba(0,0,0,0.55); }
    .annonces-dj div { background: rgba(28,20,15,0.92); color: #ffe8cc; border: 1px solid #8d6a3f; }
    .annonces-dj div.perso { background: rgba(92,56,20,0.94); }
    .dernier-combat { background: #2a1f18; color: #e9dcc8; border: 1px solid #5c4532; box-shadow: none; }
    .pad { background: radial-gradient(circle at 50% 40%, #3f3026, #241a14); box-shadow: inset 0 3px 10px rgba(0,0,0,0.6), 0 0 0 2px #4b3a2c; }
    .pad span { background: linear-gradient(#6b4f36, #4b3a2c); color: #ffd8a8; box-shadow: 0 3px 0 #120c09; }
    .pad span.actif { background: linear-gradient(#e8590c, #b8541a); color: #fff; }
    .milieu-dj { color: #c9b8a6; }
    .milieu-dj .aide { color: #a8957f; }
    .inverser-dj { background: #3a2c22; color: #ffd8a8; }
    .ent.monstre .sp .gl svg { overflow: visible; }

    .combat-dj { border: 2px solid #4b3a2c; box-shadow: inset 0 0 30px rgba(0,0,0,0.6); }
    .scene-c { position: relative; padding: 4px 0 2px; }
    .scene-c:after { content: ''; position: absolute; left: 4%; right: 4%; bottom: 40px; height: 18px; border-radius: 50%; background: radial-gradient(ellipse, rgba(0,0,0,0.45), transparent 70%); pointer-events: none; }
    .mc { background: transparent; border-color: transparent; }
    .mc.ciblable { background: rgba(255,212,59,0.08); }
    .mc-des { width: 62px; height: 62px; }
    .mc.gros .mc-des { width: 92px; height: 92px; margin-top: 8px; }
    .mc-des .gl svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.4)); }
    .intention { background: #fff8ee; border: 1.5px solid #6b4f36; box-shadow: 0 2px 0 rgba(0,0,0,0.4); }
    .mc-nom { color: #ffe8cc; text-shadow: 0 1px 2px #000; }
    .mc-pv { background: #3a1616; border: 1px solid #120c09; }
    .mc-pv i { background: linear-gradient(#f783ac, #c2255c); }
    .journal-c { background: rgba(0,0,0,0.3); border: 1px solid rgba(141,106,63,0.35); color: #e9dcc8; }
    .moi-c { background: linear-gradient(#3f3026, #2e231b); border: 1px solid #5c4532; }
    .moi-av { flex: none; width: 40px; height: 40px; }
    .moi-c .pv-dj { display: block; }
    .moi-c { padding: 3px 6px; margin-bottom: 4px; }
    .journal-c { height: 46px; }
    .scene-c .intention-nom { margin-bottom: -2px; }
    .moi-av svg { width: 100%; height: 100%; }
    .desc-c { background: #fbf0dc; border: 1px solid #c9a66b; }
    .fin-tour { background: linear-gradient(#ff922b, #e8590c); box-shadow: 0 3px 0 #8a3a0a; border: 1px solid #ffc078; }
    .pied-c button.fiole-c { background: #3f3026; border: 1px solid #5c4532; }

    /* Cartes en parchemin : bord à la couleur du type, médaillon, coût en pierre d'or */
    .carte-c { background: linear-gradient(#fffaf0, #f1dfbf); border: 2px solid #8d6a3f; border-top-width: 2px; color: #3b2a1e; box-shadow: 0 3px 0 #1b130e, inset 0 0 0 2px rgba(255,255,255,0.5); }
    .carte-c.t-attaque { border-color: #c2410c; } .carte-c.t-defense { border-color: #1864ab; } .carte-c.t-competence { border-color: #2b8a3e; }
    .carte-c.t-pouvoir { border-color: #862e9c; background: linear-gradient(#fdf5ff, #ead3f2); } .carte-c.t-malediction { border-color: #343a40; background: linear-gradient(#e9ecef, #ced4da); }
    .carte-c.r-u, .carte-c.r-r, .carte-c.r-l { outline: none; }
    .carte-c.r-l .cc-ico { box-shadow: 0 0 0 2px #b197fc, 0 0 9px rgba(177,151,252,0.9); }
    .carte-c.r-u .cc-ico { box-shadow: 0 0 0 2px #74c0fc; } .carte-c.r-r .cc-ico { box-shadow: 0 0 0 2px #fab005, 0 0 8px rgba(250,176,5,0.8); }
    .cc-ico { width: 1.55em; height: 1.55em; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #ffe8cc; border: 2px solid #c2410c; line-height: 1; margin-bottom: 2px; }
    .main-c .cc-ico { font-size: 20px; } .grande .cc-ico { font-size: 22px; } .paquet-grille .cc-ico { font-size: 18px; }
    .t-defense .cc-ico { background: #d0ebff; border-color: #1864ab; } .t-competence .cc-ico { background: #d3f9d8; border-color: #2b8a3e; }
    .t-pouvoir .cc-ico { background: #f3d9fa; border-color: #862e9c; } .t-malediction .cc-ico { background: #dee2e6; border-color: #343a40; }
    .cc-nom { color: #3b2a1e; } .cc-txt { color: #6b5644; }
    .cc-cout { background: radial-gradient(circle at 35% 30%, #fff3bf, #fab005 55%, #e67700); border: 1.5px solid #5c3a00; color: #3b2a1e; }
    .carte-c.plus .cc-nom { color: #2b8a3e; }

    /* Fenêtres en parchemin */
    .voile-dj { background: rgba(10,6,4,0.72); }
    .boite-dj { background: linear-gradient(#fdf4e3, #ecd6b0); border: 3px solid #6b4f36; color: #3b2a1e; box-shadow: 0 0 0 2px #2a1f18, 0 12px 30px rgba(0,0,0,0.6); }
    .boite-dj .titre { color: #3b2a1e; font-family: Georgia, 'Times New Roman', serif; }
    .boite-dj .aide { color: #7a6550; }
    .boite-dj ul { color: #3b2a1e; }
    .boite-dj .btn { background: #fff8ee; border: 1.5px solid #c9b08f; color: #3b2a1e; }
    .boite-dj .btn.principal { background: linear-gradient(#c2410c, #9a3412); border-color: #7c2d12; color: #fff; }
    .boite-dj .btn:disabled { opacity: 0.5; }
    .boite-dj .btn.quitter-menu { background: #fff5f5; border-color: #e03131; color: #c92a2a; margin-top: 14px; }
    .butin-l span, .ligne-achat { background: rgba(107,79,54,0.1); color: #3b2a1e; }
    .or-menu { color: #a8590f; }

    /* ================== Plein écran (3.15) : le donjon prend tout l'écran, sans onglets ================== */
    body.dj-immersif { overflow: hidden; overscroll-behavior: none; }
    body.dj-immersif #sg-bulle { display: none !important; }
    /* Pendant le jeu : pas de sélection de texte ni de menu au doigt appuyé (sinon « Toucher pour rechercher » de Google s'ouvre en bas, 3.28) */
    body.dj-jeu, body.dj-jeu * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    body.dj-jeu input, body.dj-jeu textarea { -webkit-user-select: text; user-select: text; }
    .jeu-dj.immersif { position: fixed; inset: 0; z-index: 40; border-radius: 0; box-shadow: none; display: flex; flex-direction: column; overflow: hidden;
      padding: max(8px, env(safe-area-inset-top)) 8px max(10px, env(safe-area-inset-bottom)); }
    .jeu-dj.immersif .tete-dj { flex: none; }
    .jeu-dj.immersif .ancienne-info-dj { position: absolute; left: 12px; right: 12px; top: calc(max(8px, env(safe-area-inset-top)) + 76px); z-index: 8; box-shadow: 0 6px 16px rgba(0,0,0,0.6); border: 1px solid #8d6a3f; }
    .jeu-dj.immersif .zone-explo { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
    .jeu-dj.immersif .salle-dj { flex: none; margin: 0 -4px; width: calc(100% + 8px); }
    /* Croix compacte et panneau à côté (pouvoir, côté de la croix) : le plan garde la place */
    .jeu-dj.immersif .commandes-dj { flex: none; margin-top: 6px; gap: 8px; }
    .jeu-dj.immersif .pad { width: 128px; height: 128px; }
    .jeu-dj.immersif .pad span { width: 42px; height: 42px; font-size: 17px; border-radius: 11px; }
    .jeu-dj.immersif .pad .h { left: 43px; top: 3px; } .jeu-dj.immersif .pad .b { left: 43px; bottom: 3px; }
    .jeu-dj.immersif .pad .g { left: 3px; top: 43px; } .jeu-dj.immersif .pad .d { right: 3px; top: 43px; }
    .jeu-dj.immersif .milieu-dj { align-self: stretch; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
      background: linear-gradient(#2e231b, #1f1712); border: 1px solid #4b3a2c; border-radius: 14px; padding: 8px; font-size: 0.78em; }
    .jeu-dj.immersif .milieu-dj .objectif-dj { display: none; }
    .jeu-dj.immersif .inverser-dj { margin: 0; padding: 3px 12px; }
    .jeu-dj.immersif .combat-dj { flex: 1; min-height: 0; display: flex; flex-direction: column; margin-top: 2px; }
    /* La taille des monstres suit la hauteur réelle de la scène (unités cqh) : l'annonce du coup, le nom et les PV restent toujours visibles */
    .jeu-dj.immersif .scene-c { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: safe center; container-type: size; }
    /* 3.41 : jamais plus large que sa colonne (un boss entouré de deux monstres appelés débordait de la scène, coupé à gauche) */
    .jeu-dj.immersif .mc-des { width: clamp(44px, calc(100cqh - 96px), 96px); max-width: 100%; height: auto; aspect-ratio: 1; }
    .jeu-dj.immersif .mc.gros .mc-des { width: clamp(56px, calc(100cqh - 112px), 160px); max-width: 100%; height: auto; aspect-ratio: 1; margin-top: 12px; }
    .jeu-dj.immersif .journal-c { flex: none; height: 58px; }
    .jeu-dj.immersif .main-c .carte-c { min-height: 138px; }
    .jeu-dj.immersif .main-c .cc-ico { font-size: 23px; }
    .jeu-dj.immersif .pied-c { flex: none; }
    /* Poussière qui flotte dans la lumière des torches */
    .poussiere-dj { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 4; }
    .poussiere-dj i { position: absolute; bottom: -6px; width: 3px; height: 3px; border-radius: 50%; background: #ffd8a8; opacity: 0; animation: flotte-dj linear infinite; }
    @keyframes flotte-dj { 0% { opacity: 0; transform: translate(0, 0); } 15% { opacity: 0.55; } 85% { opacity: 0.3; } 100% { opacity: 0; transform: translate(18px, -260px); } }
    /* Fondu au noir quand on change de pièce */
    .fondu-dj { position: absolute; inset: 0; background: #000; pointer-events: none; z-index: 7; animation: fondu-dj 0.45s ease-out forwards; }
    @keyframes fondu-dj { from { opacity: 0.85; } to { opacity: 0; } }
    /* Plan de l'étage : un cadre de carte qui prend toute la place libre */
    .plan-dj { flex: 1; min-height: 70px; position: relative; border-radius: 14px; overflow: hidden; cursor: pointer;
      background: radial-gradient(ellipse at 50% 45%, #2b2019 0%, #17110d 75%), #17110d; border: 1px solid #5c4532;
      box-shadow: inset 0 0 24px rgba(0,0,0,0.7), 0 2px 8px rgba(0,0,0,0.4); }
    .plan-dj:before { content: ''; position: absolute; inset: 0; opacity: 0.22; pointer-events: none;
      background-image: radial-gradient(circle, #8d6a3f 1px, transparent 1.2px); background-size: 14px 14px; }
    .plan-titre { position: absolute; left: 10px; top: 6px; right: 10px; display: flex; align-items: baseline; gap: 6px; z-index: 1;
      font-family: Georgia, 'Times New Roman', serif; font-weight: 700; color: #ffd8a8; font-size: 0.95em; text-shadow: 0 1px 3px #000; }
    .plan-titre small { font-family: inherit; font-weight: 400; color: #a8957f; font-size: 0.78em; margin-left: auto; }
    /* Difficulté de la partie, toujours visible dans le donjon (3.25, demandé par l'utilisateur) */
    .diff-dj { font-family: system-ui, sans-serif; font-weight: 800; font-size: 0.68em; border-radius: 9px; padding: 2px 7px; white-space: nowrap; text-shadow: none; align-self: center; }
    .diff-dj.d-normal { background: #2b8a3e; color: #ebfbee; }
    .diff-dj.d-heroique { background: #d9480f; color: #fff4e6; }
    .diff-dj.d-mythique { background: #6741d9; color: #f3f0ff; }
    .puce-dj.diff-dj { font-size: 0.8em; border: 0; }
    .jeu-dj.immersif .puce-dj.diff-dj { display: none; }   /* en plein écran, elle est sur le plan */
    .diff-dj.mini { font-style: normal; font-size: 0.85em; margin-left: 5px; padding: 1px 6px; }
    .plan-svg { position: absolute; left: 6px; right: 6px; top: 28px; bottom: 6px; }
    .plan-svg svg { display: block; width: 100%; height: 100%; }
    .plan-objectif { position: absolute; left: 8px; right: 8px; bottom: 5px; text-align: center; font-size: 0.72em; color: #c9b8a6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sac-tuile { margin-left: auto; border-radius: 9px; background: #3f3026; border: 1.5px solid #8d6a3f; }
    .jeu-dj:not(.immersif) .pv-dj { min-width: 46px; }
    .jeu-dj:not(.immersif) .gauche { overflow: hidden; }
    .menu-dj { flex: none; position: relative; width: 38px; height: 38px; border-radius: 10px; border: 1px solid #8d6a3f; background: #1b130e; color: #ffd8a8; font-size: 20px; line-height: 1; cursor: pointer; }
    .menu-dj b { position: absolute; right: -5px; top: -5px; min-width: 16px; height: 16px; border-radius: 8px; background: #e03131; color: #fff; font-size: 10px; line-height: 16px; padding: 0 3px; }
    .menu-liste { display: flex; flex-direction: column; gap: 0; margin-top: 6px; }
    .menu-liste .btn { text-align: left; display: flex; align-items: center; gap: 10px; }
    .menu-liste .btn .pastille { margin-left: auto; background: #e03131; color: #fff; border-radius: 9px; font-size: 0.8em; padding: 0 7px; }
    @media (prefers-reduced-motion: reduce) { .poussiere-dj, .fondu-dj { display: none; } }

    /* ================== Fiche du compagnon (3.16) ================== */
    .fiche-dj { display: block; position: relative; padding: 6px 7px; margin: 2px 0 6px; }
    .fiche-l1 { display: flex; align-items: center; gap: 7px; }
    .portrait-dj { flex: none; position: relative; width: 48px; height: 48px; border-radius: 50%; padding: 0; cursor: pointer;
      background: radial-gradient(circle at 50% 35%, #6b4f36, #241a14); border: 2px solid #c9a66b; box-shadow: 0 0 0 2px #1b130e, 0 2px 6px rgba(0,0,0,0.5); overflow: hidden; }
    .portrait-dj > span { position: absolute; left: 2px; right: 2px; top: 3px; bottom: -3px; display: flex; align-items: center; justify-content: center; }
    .portrait-dj > span svg { width: 100%; height: 100%; }
    .portrait-dj .sans { font-size: 26px; }
    .portrait-dj.ko > span { filter: grayscale(1) opacity(0.5); }
    .portrait-dj i { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-style: normal; font-size: 24px; }
    .fiche-id { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .fiche-nom { display: flex; align-items: baseline; gap: 6px; min-width: 0; white-space: nowrap; }
    .fiche-nom b { font-family: Georgia, 'Times New Roman', serif; font-size: 1.05em; color: #ffe8cc; overflow: hidden; text-overflow: ellipsis; }
    .fiche-nom span { font-size: 0.72em; font-weight: 800; color: #e9c46a; }
    .fiche-dj .pv-dj { display: block; width: 100%; min-width: 0; height: 20px; border-radius: 10px; }
    .fiche-dj .pv-dj b { line-height: 20px; font-size: 0.82em; }
    .fiche-l2 { display: flex; align-items: center; gap: 4px; margin-top: 6px; }
    .puce-dj { flex: none; border: 1px solid #5c4532; background: #1b130e; color: #f1e6d6; font: inherit; font-weight: 800; font-size: 0.8em; border-radius: 9px; padding: 2px 6px; cursor: pointer; white-space: nowrap; }
    .puce-dj.or { color: #ffd43b; }
    .fiche-l2 .carte-mini { margin-left: auto; }
    .fiche-l3 { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 6px; }
    .objet-dj { flex: none; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font: inherit; font-size: 17px; line-height: 1; padding: 0; cursor: pointer; box-sizing: border-box; }
    .objet-dj.fiole { border-radius: 10px 10px 14px 14px; background: radial-gradient(circle at 50% 70%, #1c3a52, #12202c); border: 1.5px solid #4dabf7; }

    .depart-dj .tete-dep { display: flex; align-items: center; gap: 10px; }

    .sac-dep .chev { font-size: 1.3em; color: #adb5bd; font-weight: 900; }

    /* 3.82 (demandé par l'utilisateur : « le menu donjon un peu plus sexy ») : la carte de départ prend les couleurs du donjon,
       pierre sombre et or, avec les 3 lieux du prochain donjon en vignettes (décor de combat + boss) */
    .depart-dj { color: #f1e6d2; border: 1px solid #5a4630;

    .depart-dj .diffs-dj button.actif.d-heroique { border-color: #ff922b; background: rgba(255,146,43,0.16); }
    .depart-dj .diffs-dj button.actif.d-mythique { border-color: #9775fa; background: rgba(151,117,250,0.2); }
    .depart-dj .cle-dj { background: rgba(151,117,250,0.12); border-color: #7950f2; }

    .depart-dj .perils button { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.18); color: #f1e6d2; }

    .tuiles-dep { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    /* 3.83 (demandé par l'utilisateur : « intègre Ma semaine et Mon héros dans le design revu, homogénéise l'intérieur ») :

    .fen-dep .salon-puce { background: rgba(255,255,255,0.06); border-color: rgba(255,214,140,0.3); }
    .fen-dep .salon-puce.actif { background: rgba(255,214,140,0.16); border-color: #ffc46b; }

    .fen-dep .sous-sem { color: #ffc46b; font-family: Georgia, serif; }

    .fen-dep .cartes-gr { display: flex; flex-wrap: wrap; gap: 10px 6px; margin-top: 8px; }
    .fen-dep .cartes-gr .carte-c { width: calc(33.3% - 4px); height: 150px; cursor: pointer; }
    .fen-dep .cartes-gr .carte-c.choisie { transform: translateY(-4px); box-shadow: 0 0 0 3px #7048e8, 0 4px 12px rgba(112,72,232,0.5); }
    .fen-dep .aucune-gr { width: calc(33.3% - 4px); height: 150px; border: 2px dashed rgba(255,214,140,0.4); border-radius: 10px; background: rgba(255,255,255,0.05); font: inherit; font-weight: 800; color: #c2b39a; font-size: 0.8em; }

<body>
  <div id="app" v-cloak class="app">

    <fiche-jeu jeu="donjon" nom="Donjon des compagnons" resume="Désdale · chaque compagnon a son pouvoir" :onglet.sync="onglet" :son.sync="sonActif" :connexion="role ? connexion : ''">
      <template v-slot:logo><div style="font-size:44px;line-height:1">🗝️</div></template>

      <!-- PARTIE : mon compagnon, le salon, explorer seul -->
      <template v-slot:partie>
        <!-- Onglet Partie refait en 3.78 (demandé par l'utilisateur : « l'interface sous le bouton Donjon devient un peu fouillis ») :
             tout ce qui sert à partir dans une seule carte en haut ; Ma semaine et Mon héros en tuiles qui ouvrent une fenêtre -->
        <section class="carte depart-dj">
          <div class="tete-dep">
            <svg v-if="monCp" class="cp-dep" viewBox="0 -6 200 216" v-html="dessin(monCp, 'moi')"></svg>
            <div v-else class="cp-dep vide">🧭</div>
            <div class="id-dep">
              <b>{{ monCp ? monCp.n : 'Sans compagnon' }}</b>
              <div class="puces-dep">
                <button class="classe-dj" @click="infoClasse = !infoClasse">{{ D.CLASSES[maClasse].ico }} {{ D.CLASSES[maClasse].nom }} · {{ D.CLASSES[maClasse].pv }} PV</button>
                <button v-if="monCp" class="pouvoir" @click="infoClasse = !infoClasse">{{ POUVOIRS[monPouvoir].ico }} {{ POUVOIRS[monPouvoir].nom }}</button>
              </div>
            </div>
          </div>
          <div class="aide aide-dep" v-if="infoClasse || !monCp">
            <template v-if="monCp">{{ monCp.n }} {{ ESPECES[monCp.e].action }}. En combat : {{ D.CLASSES[monPouvoir].texte.toLowerCase() }}.</template>
            <template v-else>Tu explores sans pouvoir, avec les cartes de base. <a href="compagnon/">Adopter un compagnon</a></template>
          </div>

          <!-- Les 3 lieux du donjon (3.82, demandé par l'utilisateur : savoir où l'on va avant de partir) : décor, boss, règle ; toucher = le détail -->
          <div class="prochain-dep" v-if="lieuxDep">
            <div class="titre-dep">{{ lieuxDep.titre }}</div>
            <div class="lieux-dep">
              <template v-for="(v, i) in lieuxDep.liste">
                <span v-if="i" :key="'f' + i" class="fleche-dep">›</span>
                <button :key="v.cle" class="lieu-v" :class="[v.etat, { choisi: lieuInfo === v.cle }]" @click="toucherLieu(v)">
                  <span class="dec" v-html="v.svg"></span>
                  <span class="boss-v" v-html="v.bossSvg"></span>
                  <span class="num-v">{{ ['I', 'II', 'III'][i] }}</span>
                  <span v-if="v.regle" class="regle-v">{{ v.regle.ico }}</span>
                  <span v-if="v.etat === 'fait'" class="fait-v">✓</span>
                  <span class="nom-v">{{ v.nom.replace(/^(La |Les |Le )/, '') }}</span>
                </button>
              </template>
            </div>
            <div class="info-lieu" v-if="lieuChoisi">
              <b>Étage {{ lieuChoisi.etage }} · {{ lieuChoisi.nom }}</b>
              <template v-if="lieuChoisi.regle"><span class="regle-l">{{ lieuChoisi.regle.ico }} {{ lieuChoisi.regle.nom }}</span> {{ lieuChoisi.regle.texte }}</template>
              <template v-else> Pas de règle particulière : le lieu d'origine, sans surprise.</template>
              <span class="boss-l">👑 Au fond : {{ lieuChoisi.boss }}</span>
            </div>
            <div class="aide aide-lieux" v-else>{{ lieuxDep.enCours ? 'Touche un lieu pour revoir sa règle.' : 'Touche un lieu pour lire sa règle avant de partir.' }}</div>
          </div>

          <!-- Dans un salon : la difficulté se choisit dans la salle d'attente (onglet Jouer) -->
          <template v-if="role">
          <div class="salon-dep">
            <div class="salon-tete">
              <span class="pastille" :class="{ attente: connexion !== 'ok' }"></span>
              <div>
                <div class="salon-nom">Salon « {{ roomCode }} »</div>
                <div class="salon-role">Tu explores en tant que {{ moi }} · {{ connexionTexte }}</div>
              </div>
            </div>
            <div class="actions-accueil">
              <button class="btn principal" @click="onglet = 'play'">Jouer →</button>
              <button class="btn" @click="quitterSalon">Quitter</button>
            </div>
          </div>

            <button class="sac-dep" v-if="!partie || partie.phase !== 'jeu'" @click="fenPartie = 'sac'">
              <span class="ico">🎒</span>
              <span class="txt"><b>Au départ</b><span class="l">
                <template v-if="grimChoix || fiolesPrises.length"><template v-if="grimChoix">{{ DJ.carte(grimChoix).ico }} {{ DJ.carte(grimChoix).nom }}</template><template v-if="grimChoix && fiolesPrises.length"> · </template><template v-if="fiolesPrises.length">{{ fiolesPrises.map(f => VL.FIOLES[f].ico).join(' ') }}</template></template>

        </div>

        <!-- Arrivée dans un lieu qui a sa règle (3.41) : on la présente une fois par étage ; le bouton ne répond qu'au bout de 0,6 s (doigt resté sur la croix) -->
        <div class="voile-dj entree-combat" v-if="lieuAnnonce && partie && partie.phase === 'jeu' && regle && !combat">
          <div class="boite-dj">
            <div class="grand">{{ lieu.ico }}</div>
            <div class="titre">{{ lieu.nom }}</div>
            <div class="aide" style="font-size:0.9em">{{ partie.faille ? partie.faille.nom : 'Étage ' + partie.etage + ' sur ' + DJ.NB_ETAGES }} · le boss : {{ DJ.MONSTRES[lieu.boss].nom }}</div>
            <div class="regle-entree grande"><b>{{ regle.ico }} Règle du lieu : {{ regle.nom }}</b>{{ regle.texte }}</div>
            <button class="btn principal" @click="fermerLieu">Compris !</button>
          </div>
        </div>

        <!-- Entrée en combat (3.31, demandé par l'utilisateur : le doigt encore sur la croix touchait « Fin du tour ») :
             il faut toucher « Au combat » pour voir les cartes ; le bouton ne répond qu'au bout de 0,6 s et le voile ne se ferme pas tout seul -->
        <div class="voile-dj entree-combat" v-if="entreeCombat && combat && combat.id === entreeCombat.id">
          <div class="boite-dj">
            <div class="grand">{{ entreeCombat.rang === 'boss' ? '👑' : entreeCombat.rang === 'elite' ? '⭐' : combat.embuscade ? '💥' : '⚔️' }}</div>
            <div class="titre">{{ entreeCombat.rang === 'boss' ? 'Le boss !' : entreeCombat.rang === 'elite' ? 'Un élite !' : combat.embuscade ? 'Embuscade !' : 'Combat !' }}</div>
            <div class="noms-combat">{{ entreeCombat.noms }}</div>
            <div class="aide" style="font-size:0.9em">{{ combat.embuscade ? 'Pris par surprise : tu commences 🎯 Vulnérable.' : 'Joue tes cartes, puis touche « Fin du tour ».' }}</div>
            <div v-if="regle" class="regle-entree">{{ regle.ico }} <b>{{ regle.nom }}</b> · {{ regle.court }}</div>
            <button class="btn principal" @click="fermerEntreeCombat">⚔️ Au combat !</button>
          </div>
        </div>

        <!-- Abandon -->
        <div class="voile-dj" v-if="demandeQuitter" @click.self="demandeQuitter = false">
          <div class="boite-dj">
            <div class="grand">🏳️</div>
            <div class="titre">Quitter le donjon ?</div>
            <template v-if="solo">
              <button class="btn principal" @click="quitterDonjon">⏸️ Quitter, je reprendrai plus tard</button>
              <div class="aide" style="font-size:0.9em">Ton exploration est gardée.</div>
              <button class="btn" @click="abandonnerSolo">🔄 Abandonner ce donjon</button>
              <div class="aide" style="font-size:0.9em">Tu perds la progression de ce donjon (clés, poussières) et tu peux en commencer un nouveau.</div>
            </template>
            <template v-else>
              <div class="aide" style="font-size:0.9em">Tu quittes le salon ; les autres continuent sans toi.</div>
              <button class="btn principal" @click="quitterDonjon">Quitter et revenir à l'accueil</button>
            </template>
            <button class="btn" @click="demandeQuitter = false">↩ Continuer l'exploration</button>
          </div>
        </div>

        <!-- Fenêtres du donjon : butin, relique de boss, feu de camp, marchand, autel, choix dans le paquet -->
        <div class="voile-dj" v-if="menu && onglet === 'play' && !(partie && partie.phase === 'fin')">
          <div class="boite-dj boite-menu">
            <template v-if="menu.type === 'butin' || menu.type === 'choix'">
              <div class="titre">{{ menu.type === 'choix' ? '📚 ' + menu.titre : menu.rang === 'boss' ? '👑 Boss vaincu !' : menu.rang === 'elite' ? '⭐ Élite vaincu !' : '🎉 Victoire !' }}</div>
              <div class="butin-l" v-if="menu.type === 'butin'">
                <span>🪙 +{{ menu.or }} or</span>
                <span v-if="menu.fiole">{{ D.FIOLES[menu.fiole].ico }} {{ D.FIOLES[menu.fiole].nom }}</span>
                <span v-if="menu.relique">{{ D.RELIQUES[menu.relique].ico }} <b>{{ D.RELIQUES[menu.relique].nom }}</b> : {{ D.RELIQUES[menu.relique].texte }}</span>
              </div>
              <div class="aide" style="margin-top:0">Ajoute une carte à ton paquet :</div>
              <div class="choix-cartes grande" :class="{ quatre: menu.cartes.length > 3 }">
                <carte-dj v-for="(id, i) in menu.cartes" :key="'b' + i + id" :id="id" :class="{ choisie: choixMenu === i }" @click.native="choisirCarteMenu(i)"></carte-dj>
              </div>
              <button class="btn principal" :disabled="choixMenu === null" @click="menuAction('prendre', choixMenu)">{{ choixMenu === null ? 'Touche une carte' : 'Prendre « ' + carte(menu.cartes[choixMenu]).nom + ' »' }}</button>
              <button class="btn" :class="{ 'passer-conf': confirmePasser }" @click="passerButin">{{ confirmePasser ? '⚠️ Vraiment passer ? Touche encore pour confirmer' : 'Passer (garder un paquet léger)' }}</button>
            </template>

            <template v-else-if="menu.type === 'rejoindre'">
              <div class="grand">{{ menu.rang === 'boss' ? '👑' : menu.rang === 'elite' ? '⭐' : '⚔️' }}</div>
              <div class="titre">Combat à côté !</div>
              <div class="aide" v-if="renfort">{{ renfort.amis }} {{ renfort.amis.indexOf(' et ') >= 0 ? 'se battent' : 'se bat' }} contre {{ renfort.monstres }} dans la pièce voisine{{ renfort.cote ? ' (' + renfort.cote + ')' : '' }}.</div>
              <button class="btn principal" @click="menuAction('oui')">⚔️ Le rejoindre tout de suite</button>
              <button class="btn" @click="menuAction('non')">Rester ici</button>
              <div class="aide" style="font-size:0.85em">Sinon, tu pourras toujours y entrer à pied : tu regarderas un tour avant de jouer.</div>
            </template>
            <template v-else-if="menu.type === 'reliqueBoss'">
              <div class="grand">👑</div>
              <div class="titre">Le trésor du boss</div>
              <div class="aide">Choisis une relique : puissante, mais avec un prix.</div>
              <div v-for="(r, i) in menu.choix" :key="r" class="ligne-achat"><span class="ico">{{ D.RELIQUES[r].ico }}</span><span class="txt"><b>{{ D.RELIQUES[r].nom }}</b><br>{{ D.RELIQUES[r].texte }}</span><button @click="menuAction('prendre', i)">Prendre</button></div>
            </template>

            <template v-else-if="menu.type === 'feu'">
              <div class="grand">🔥</div>
              <div class="titre">Feu de camp</div>
              <div class="aide">Une seule chose avant de repartir.</div>
              <button class="btn principal" @click="menuAction('repos')" :disabled="!soinFeu">😴 Se reposer (+{{ Math.min(soinFeu, monJ.pvMax - monJ.pv) }} PV)</button>
              <button class="btn principal" @click="menuAction('aiguiser')">⚒️ Améliorer une carte</button>
              <button class="btn" @click="menuAction('partir')">Plus tard</button>
            </template>

            <template v-else-if="menu.type === 'marchand'">
              <div class="titre">🛒 Le marchand <span class="or-menu">🪙 {{ monJ.or }}</span></div>
              <div class="choix-cartes grande">
                <carte-dj v-for="(o, i) in boutique.cartes" :key="'m' + i" :id="o.id" :prix="o.vendu ? null : o.prix" :class="{ vendu: o.vendu, choisie: choixMenu === i }" @click.native="choixMenu = i"></carte-dj>
              </div>
              <button v-if="choixMenu !== null && boutique.cartes[choixMenu] && !boutique.cartes[choixMenu].vendu" class="btn principal" :disabled="monJ.or < boutique.cartes[choixMenu].prix" @click="acheterCarte">Acheter « {{ carte(boutique.cartes[choixMenu].id).nom }} » ({{ boutique.cartes[choixMenu].prix }} or)</button>
              <div v-for="(o, i) in boutique.fioles" :key="'mf' + i" class="ligne-achat" :class="{ vendu: o.vendu }"><span class="ico">{{ D.FIOLES[o.id].ico }}</span><span class="txt"><b>{{ D.FIOLES[o.id].nom }}</b></span><button :disabled="o.vendu || monJ.or < o.prix || monJ.fioles.length >= monJ.fiolesMax" @click="menuAction('fiole', i)">{{ o.vendu ? 'Vendue' : '🪙 ' + o.prix }}</button></div>
              <div v-if="boutique.relique" class="ligne-achat" :class="{ vendu: boutique.relique.vendu }"><span class="ico">{{ D.RELIQUES[boutique.relique.id].ico }}</span><span class="txt"><b>{{ D.RELIQUES[boutique.relique.id].nom }}</b><br>{{ D.RELIQUES[boutique.relique.id].texte }}</span><button :disabled="boutique.relique.vendu || monJ.or < boutique.relique.prix" @click="menuAction('relique')">{{ boutique.relique.vendu ? 'Vendue' : '🪙 ' + boutique.relique.prix }}</button></div>
              <div class="ligne-achat"><span class="ico">✂️</span><span class="txt"><b>Retirer une carte</b><br>Un paquet plus léger pioche plus souvent tes meilleures cartes.</span><button :disabled="monJ.or < DJ.prixRetrait(monJ)" @click="menuAction('retrait')">🪙 {{ DJ.prixRetrait(monJ) }}</button></div>
              <button class="btn" @click="menuAction('partir')">Partir</button>
            </template>

            <template v-else-if="menu.type === 'evenement'">
              <div class="grand">{{ D.EVENEMENTS[menu.id].ico }}</div>
              <div class="titre">{{ D.EVENEMENTS[menu.id].titre }}</div>
              <div class="aide">{{ D.EVENEMENTS[menu.id].texte }}</div>
              <button v-for="(t, i) in D.EVENEMENTS[menu.id].choix" :key="i" class="btn" :class="{ principal: i === 0 }" @click="menuAction('choix', i)">{{ t }}</button>
            </template>

            <template v-else-if="menu.type === 'paquet'">
              <div class="titre">{{ { ameliorer: '⚒️ Améliorer une carte', retirer: '✂️ Retirer une carte', copier: '🪞 Copier une carte', transformer: '🫕 Jeter une carte au chaudron' }[menu.mode] }}</div>
              <div class="apercu-plus grande" v-if="menu.mode === 'ameliorer' && choixMenu !== null && monJ.paquet[choixMenu]">
                <carte-dj :id="monJ.paquet[choixMenu]"></carte-dj><b>→</b><carte-dj :id="monJ.paquet[choixMenu] + '+'" class="plus"></carte-dj>
              </div>
              <button class="btn principal" :disabled="choixMenu === null || !choixPaquetPossible" @click="menuAction('carte', choixMenu)">{{ choixMenu === null ? 'Touche une carte' : { ameliorer: 'Améliorer', retirer: 'Retirer', copier: 'Copier', transformer: 'Transformer' }[menu.mode] + ' « ' + carte(monJ.paquet[choixMenu]).nom + ' »' + (menu.prix ? ' (' + menu.prix + ' or)' : '') }}</button>
              <button class="btn" @click="menuAction('annuler')">↩ Annuler</button>
              <div class="paquet-grille">
                <carte-dj v-for="x in paquetTrie" :key="'pq' + x.i" :id="x.id" :class="{ choisie: choixMenu === x.i, vendu: !possiblePaquet(x.id) }" :style="{ opacity: possiblePaquet(x.id) ? 1 : 0.35 }" @click.native="choisirPaquet(x)"></carte-dj>
              </div>
            </template>
          </div>
        </div>

        <!-- Mon sac : le compagnon et tous ses objets, avec leur effet -->
        <div class="voile-dj" v-if="voirSac && monJ" @click.self="voirSac = false">
          <div class="boite-dj boite-menu">
            <div class="sac-tete">
              <span class="portrait-dj" :class="{ ko: monJ.fantome }"><span v-if="monJ.cp" v-html="dessinSvg(monJ.cp)"></span><span v-else class="sans">🧭</span></span>
              <div><div class="titre" style="margin:0">{{ monJ.cp && monJ.cp.n ? monJ.cp.n : 'Explorateur' }}</div>
                <span class="classe-dj">{{ D.CLASSES[monJ.classe].ico }} {{ D.CLASSES[monJ.classe].nom }}</span>
                <div class="aide" style="margin:2px 0 0">{{ D.CLASSES[monJ.classe].texte }}</div></div>
            </div>
            <div class="sac-chiffres">
              <span>❤️ {{ monJ.pv }} / {{ monJ.pvMax }}</span><span>🪙 {{ monJ.or }}</span><span>🗝️ {{ partie.cles }}{{ partie.grandeCle ? ' + 🔑' : '' }}</span>
              <span>✨ {{ partie.poussiere }}</span><span>{{ etageIco }} {{ partie.faille ? 'faille' : 'étage ' + partie.etage + '/' + DJ.NB_ETAGES }}</span>
            </div>
            <div class="sac-titre">Fioles ({{ monJ.fioles.length }} / {{ monJ.fiolesMax }})</div>
            <div v-for="(f, i) in monJ.fioles" :key="'sf' + i + f" class="sac-ligne sac-fiole"><span class="ico">{{ D.FIOLES[f].ico }}</span>
              <span class="txt"><b>{{ D.FIOLES[f].nom }}</b> · {{ D.FIOLES[f].texte }}{{ D.FIOLES[f].dehors ? '' : ' (en combat)' }}</span>
              <button v-if="D.FIOLES[f].dehors && !combat" @click="infoFiole = i; boireFiole()">Boire</button>
              <button class="jeter" @click="infoFiole = i; jeterFiole()">Jeter</button></div>
            <div v-if="!monJ.fioles.length" class="aide" style="text-align:left;margin-top:2px">Aucune fiole : on en trouve après les combats, chez le marchand ou à l'autel.</div>
            <div class="sac-titre">Reliques ({{ monJ.reliques.length }})</div>
            <div class="sac-grille"><div v-for="r in monJ.reliques" :key="'sr' + r" class="sac-ligne"><span class="ico">{{ D.RELIQUES[r].ico }}</span>
              <span class="txt"><b>{{ D.RELIQUES[r].nom }}</b><br>{{ D.RELIQUES[r].texte }}</span></div></div>
            <div v-if="!monJ.reliques.length" class="aide" style="text-align:left;margin-top:2px">Aucune relique : les élites ⭐, le trésor de l'étage et le marchand en donnent.</div>
            <button class="btn principal" style="margin-top:10px" @click="voirSac = false; voirPaquet = true">🃏 Voir mon paquet ({{ monJ.paquet.length }} cartes)</button>
            <button class="btn" @click="voirSac = false">Fermer</button>
          </div>
        </div>

        <!-- Mon paquet (consultation) -->
        <div class="voile-dj" v-if="voirPaquet && monJ" @click.self="voirPaquet = false">
          <div class="boite-dj boite-menu">
            <div class="titre">🃏 Mon paquet ({{ monJ.paquet.length }} cartes)</div>
            <div class="aide" style="margin-top:0"><span class="classe-dj">{{ D.CLASSES[monJ.classe].ico }} {{ D.CLASSES[monJ.classe].nom }}</span> · cartes améliorées en vert (+)</div>
            <button class="btn" @click="voirPaquet = false">Fermer</button>
            <div class="paquet-grille">
              <carte-dj v-for="x in paquetTrie" :key="'v' + x.i" :id="x.id"></carte-dj>
            </div>
          </div>
        </div>

        <!-- Fin -->
        <div class="voile-dj" v-if="partie && partie.phase === 'fin' && gains">
          <div class="boite-dj">
            <div class="grand">{{ partie.fin.gagne ? '🏆' : '👻' }}</div>
            <div class="titre">{{ partie.fin.gagne ? (partie.faille ? (partie.faille.sanct ? 'Le gardien du sanctuaire est vaincu !' : 'La faille est refermée !') : 'Le donjon est vaincu !') : 'Tout le groupe est KO…' }}</div>
            <div class="aide" v-if="partie.faille">{{ partie.faille.nom }}{{ partie.fin.gagne ? ' : ta récompense t\'attend dans la Vallée.' : partie.faille.sanct ? ' : le gardien t\'attend encore, tu pourras revenir.' : ' reste ouverte : tu pourras y redescendre.' }}</div>
            <div class="rares-fin" v-if="gains.rares">
              <div class="titre-tr">📖 {{ gains.rareChoisie ? 'Ta carte rare, rangée dans ton Grimoire :' : 'Choisis une carte rare pour ton Grimoire des Terres' }}</div>
              <div class="cartes-gr"><carte-dj v-for="id in gains.rares" :key="'rf' + id" :id="id" v-show="!gains.rareChoisie || gains.rareChoisie === id" :class="{ choisie: gains.rareChoisie === id }" @click.native="choisirRare(id)"></carte-dj></div>
              <div class="aide">{{ gains.rareChoisie ? 'Tu pourras l\'emporter au départ de chaque donjon (onglet Partie).' : 'Une carte que tu as déjà revient améliorée. Touche celle que tu veux garder.' }}</div>
            </div>
            <div class="aide" v-if="!partie.fin.gagne">Arrivé à l'étage {{ partie.fin.etage || partie.etage }} : {{ DJ.lieu(partie, partie.fin.etage || partie.etage).nom }}.</div>
            <ul>
              <li>✨ {{ gains.poussieres != null ? gains.poussieres : partie.poussiere }} poussière{{ (gains.poussieres != null ? gains.poussieres : partie.poussiere) > 1 ? 's' : '' }} d'étoile<small v-if="gains.mult && gains.mult !== 1"> ({{ partie.poussiere }} × {{ String(gains.mult).replace('.', ',') }}, {{ D.DIFFICULTES[gains.difficulte].nom }})</small><span v-if="gains.etoiles"> → +{{ gains.etoilesDonnees }} ⭐</span> (en réserve : {{ gains.reste }} / 5)</li>
              <li v-if="gains.partie">⭐ {{ gains.partie }}</li>
              <li v-if="gains.souvenir">{{ gains.souvenir.ico }} Souvenir : {{ gains.souvenir.nom }} (dans la maison de {{ monCp.n }})</li>
              <li v-if="gains.peril">🗝️ Nouvelle clé mythique : +{{ gains.peril }} ({{ D.PERILS[gains.peril] }})</li>
              <li v-if="gains.eclats">💠 +{{ gains.eclats }} éclat{{ gains.eclats > 1 ? 's' : '' }} pour la semaine (boss vaincus)</li>
              <li v-if="gains.ouvre">🔓 {{ D.DIFFICULTES[gains.ouvre].nom }} est ouvert pour la semaine !</li>
              <li v-if="gains.hero">🧙 Ton héros garde son paquet ({{ gains.hero.paquet.length }} cartes)<template v-if="gains.hero.pv">, +{{ gains.hero.pv }} PV max</template> et {{ gains.hero.reliques.length }} relique{{ gains.hero.reliques.length > 1 ? 's' : '' }} pour le prochain donjon.</li>
            </ul>
            <!-- Choix des reliques que garde le héros de la semaine (refait en 3.79 : emplacements, effet de chaque relique, plus de retrait en silence) -->
            <div class="trophees-fin choix-rel" v-if="gains.reliquesDispo && gains.reliquesDispo.length > D.SEMAINE.reliquesMax || nbBossDispo > 1">
              <div class="titre-tr">🎒 Les reliques que ton héros garde</div>
              <div class="slots-rel">
                <span v-for="k in D.SEMAINE.reliquesMax" :key="'sl' + k" class="slot-rel" :class="{ plein: choixRel[k - 1], boss: choixRel[k - 1] && D.RELIQUES[choixRel[k - 1]].rar === 'boss' }" @click="choixRel[k - 1] && basculerRelique(choixRel[k - 1])">{{ choixRel[k - 1] ? D.RELIQUES[choixRel[k - 1]].ico : '' }}</span>
                <small>{{ choixRel.length }}/{{ D.SEMAINE.reliquesMax }} · une seule de boss</small>
              </div>
              <div class="msg-rel" v-if="msgRel">{{ msgRel }}</div>
              <div class="liste-rel">
                <button v-for="r in reliquesFin" :key="'rl' + r" class="rel-l" :class="['r-' + D.RELIQUES[r].rar, { garde: choixRel.indexOf(r) >= 0 }]" @click="basculerRelique(r)">
                  <span class="ico">{{ D.RELIQUES[r].ico }}</span>
                  <span class="txt"><small class="rar">{{ RARETES_REL[D.RELIQUES[r].rar] }}</small><b>{{ D.RELIQUES[r].nom }}</b><span class="eff">{{ D.RELIQUES[r].texte }}</span></span>
                  <span class="coche">{{ choixRel.indexOf(r) >= 0 ? '✓' : '+' }}</span>
                </button>
              </div>
              <div class="aide">Touche une relique pour la garder ou la laisser. Les autres restent dans ce donjon.</div>
            </div>
            <button v-if="!solo && role === 'hote'" class="btn principal" @click="envoyerJeu({ type: 'NOUVELLE' })">🔁 Nouveau donjon</button>
            <button v-if="solo && partie.faille" class="btn principal" @click="rentrerFaille">🌀 Retour à la Vallée</button>
            <button v-if="solo && !partie.faille" class="btn principal" @click="nouveauSolo">🔁 Nouveau donjon</button>
            <div v-if="!solo && role !== 'hote'" class="aide">L'hôte peut relancer un nouveau donjon.</div>
            <button v-if="!partie.faille" class="btn" @click="rentrer">{{ monCp ? '🏠 Rentrer à la maison' : '🏠 Retour à l\'accueil' }}</button>
          </div>
        </div>
      </template>

      <!-- RÉGLAGES -->
      <template v-slot:reglages>
        <section class="carte reglages">
          <div class="titre-carte">Réglages</div>
          <reglages-base :son.sync="sonActif" :vibration.sync="vibrationActive"></reglages-base>
          <label class="option-dj">Croix à droite (gaucher)<input type="checkbox" v-model="inverse"></label>
          <label class="option-dj">Plein écran pendant l'exploration<input type="checkbox" :checked="immersionVoulue" @change="basculerPleinEcran"></label>
          <label class="option-dj" v-if="immersionVoulue">Cacher aussi les barres du téléphone<input type="checkbox" :checked="barresCachees" @change="basculerBarres"></label>
          <p class="aide-dj" v-if="immersionVoulue" style="margin:4px 0 0;font-size:13px;color:#666">Avec les barres cachées, le téléphone affiche quelques secondes son message « faites glisser pour quitter le plein écran » : une page web ne peut pas l'empêcher. Barres visibles : plus de message.</p>
        </section>
      </template>

      <!-- RÈGLES -->
      <template v-slot:regles>
        <section class="carte regles">
          <div class="titre-carte">Règles</div>
          <ul>
            <li>Le donjon a <strong>3 étages</strong> : 🕳️ les Caves, ⚰️ les Catacombes, 🏰 la Forteresse. <strong>Un étage peut être un autre lieu</strong>, tiré au hasard à chaque donjon, avec ses monstres, son boss et sa <strong>règle</strong> : à la place des Caves, 🍄 la Champignonnière (<em>Spores</em> : qui finit son tour sans armure reçoit ☠️ Poison 1, les monstres aussi ; boss : le Grand Mycélium) ou 🌊 la Rivière souterraine (<em>Marée</em> : un tour sur deux, marée haute, tous les coups font 25 % de dégâts en moins, les tiens comme ceux des monstres ; boss : la Pieuvre des profondeurs, dont il faut couper les tentacules) ; à la place des Catacombes, ❄️ la Grotte de glace (<em>Engelures</em> : à chaque tour, une carte de ta main gèle au hasard ; elle ne se joue pas, mais tu la gardes pour le tour suivant ; le ❄️ Givre des monstres en gèle d'autres ; boss : le Dragon de givre, dont les glaçons gèlent une carte en éclatant) ou 📚 la Bibliothèque interdite (<em>Savoir</em> : la 3e carte que tu joues dans un tour ne coûte rien ; boss : l'Archiviste, dont l'Archivage frappe plus fort pour chaque livre mordeur sorti des rayons). À la place de la Forteresse, ⚒️ les Forges (<em>Braises</em> : au début de chaque tour, tu reçois 🔥 Brûlure 1 et chaque monstre Brûlure 3 ; les braises vivantes explosent si on ne les éteint pas avant la fin de leur mèche, et le squelette forgeron renforce tous les monstres ; boss : le Titan de fonte, qui entre en fusion à la moitié de sa vie et change de façon de combattre) ou 🕰️ la Tour de l'horloge (<em>Temps détraqué</em> : 4 ⚡ par tour au lieu de 3, mais seulement 4 cartes ; les automates et le gardien de bronze réagissent à ce que tu as joué au tour d'avant, le coucou vole une carte de ta pioche (rendue quand il tombe), le sablier vivant remonte le temps et retrouve ses PV perdus ; boss : le Maître du Temps, qui détraque toutes les horloges à la moitié de sa vie). Chaque étage se visite pièce par pièce (la petite carte en haut à droite montre les pièces vues). Un <strong>élite ⭐</strong> garde la grande clé 🔑 qui ouvre la porte du <strong>boss 👑</strong> ; le boss vaincu, un escalier 🪜 descend à l'étage suivant (la moitié des PV perdus revient). Vaincre le boss du dernier étage (la Liche, le Titan de fonte ou le Maître du Temps) gagne le donjon.</li>
            <li>La croix fait avancer ton compagnon (garde le doigt pour marcher). Le bouton ⇄ la met de l'autre côté.</li>
            <li><strong>Chaque compagnon a un pouvoir</strong>, qui ouvre un obstacle (fonce dedans) et donne sa <strong>classe de cartes</strong> :
              🔥 <strong>Feu</strong> (dragon, chat, oie : ronces) brûle tous les monstres ·
              💪 <strong>Carapace</strong> (panda, tortue, chèvre : rochers) armure, épines et gros coups ·
              🦘 <strong>Vivacité</strong> (lapin, écureuil, singe : trous) cartes à 0 ⚡, coups multiples ·
              👃 <strong>Ruse</strong> (chien, renard, raton laveur : passages secrets) poison et points faibles.</li>
            <li><strong>Combat</strong> : au contact d'un monstre. À chaque tour, tu as <strong>3 ⚡</strong> et tu pioches <strong>5 cartes</strong> ; joue-les dans l'ordre que tu veux (le chiffre jaune = son coût), puis « Fin du tour ». Les cartes non jouées partent à la défausse ; la pioche vide, la défausse est remélangée.</li>
            <li>Une carte <strong>épuisée</strong> quitte le combat une fois jouée (elle revient au combat suivant). 💫 <strong>Assommer</strong> fait perdre au monstre visé son prochain coup, boss compris. 📌 <strong>Prévoyance</strong> fait garder toute sa main pour le tour suivant ; avec la relique 🔖 <strong>Marque-page</strong>, touche une carte puis « Garder » pour la garder au tour suivant.</li>
            <li>Chaque monstre <strong>annonce ce qu'il va faire</strong> : ⚔️ 12 = 12 dégâts, ×2 = deux coups, 🛡️ armure, 💪 force, 😤 grosse attaque au prochain tour… Lis-les pour choisir entre attaquer et te protéger.</li>
            <li><strong>Armure 🛡️</strong> : elle prend les coups avant tes PV, puis disparaît au début de ton tour. États : 🎯 Vulnérable (+50 % de dégâts reçus), 🥀 Faible (−25 % de dégâts), 🧊 Fragile (−25 % d'armure), ☠️ Poison et 🔥 Brûlure (PV perdus au début du tour), 💪 Force (+dégâts à chaque coup). Touche un état pour le relire.</li>
            <li>Après chaque combat : de l'or 🪙, parfois une fiole, et <strong>une carte au choix parmi 3</strong> (ou passer : un paquet léger pioche plus souvent tes meilleures cartes). Les élites donnent une <strong>relique</strong> (effet permanent), les boss une relique puissante au choix.</li>
            <li><strong>Salles</strong> : 🔥 feu de camp (se reposer ou améliorer une carte), 🛒 marchand (cartes, fioles, relique, retrait d'une carte), ❓ autel (un choix, parfois risqué). Les coffres sont gardés tant que les monstres de la pièce sont là.</li>
            <li><strong>Choisis ton chemin</strong> : le plan montre déjà ce qu'il y a dans les pièces voisines (⚔️ monstres, ⭐ élite, 🔥, 🛒, ❓, 👑 boss). Seuls l'élite et le boss sont obligatoires. Chaque étage cache aussi une <strong>pièce à risque</strong>, jamais obligatoire : 💀 <strong>salle du défi</strong> (un second élite : une relique de plus), 💰 <strong>trésor piégé</strong> (ouvrir le grand coffre déclenche une embuscade où tu commences Vulnérable ; ensuite, beaucoup d'or, une fiole et des poussières), 🔮 <strong>coffre maudit</strong> (une relique, contre une malédiction dans le paquet : 🏋️ Fardeau ou 🌀 Doute, qu'on peut jouer pour 1 ⚡ pour s'en débarrasser le temps du combat).</li>
            <li><strong>Fioles</strong> (2 emplacements) : à boire pendant ton tour ; la fiole de soin se boit aussi hors combat.</li>
            <li>Difficulté, choisie avant d'entrer (par l'hôte dans un salon) : 🛡️ Normal (monstres un peu plus doux ; poussières ×0,7), ⚔️ Héroïque (le défi prévu ; ×1), 💀 Mythique (monstres plus coriaces ; ×1,5). En Mythique, on choisit aussi sa clé.</li>
            <li>À plusieurs : chacun a ses cartes, son or et ses reliques ; les monstres ont plus de PV et frappent plus fort selon la difficulté et le nombre de joueurs <strong>présents dans le combat</strong> (seul dans la pièce, on les affronte comme en solo) ; leurs coups de zone ne sont pas renforcés ; le poison les ronge moins. Après un combat gagné ensemble, chacun reprend 10 % de ses PV. Une grille ⛓️ s'ouvre à deux sur les dalles. Un ami KO revient en fin de combat gagné, avec un Trèfle, ou si un ami reste 2 s à côté de lui. Tout le groupe KO : fin.</li>
            <li><strong>Ma semaine</strong> (du lundi au dimanche) : lundi, seul Normal est ouvert. Gagner un donjon en Normal ouvre Héroïque, gagner en Héroïque ouvre Mythique (entre amis, la victoire compte pour chacun). <strong>Ton héros grandit toute la semaine</strong> : à la fin de chaque donjon, gagné ou perdu, il garde son paquet (sans les malédictions), jusqu'à {{ D.SEMAINE.reliquesMax }} reliques (dont une seule de boss) et les PV max gagnés (+{{ D.SEMAINE.pvMax }} au plus), et repart avec dans le donjon suivant. Héroïque et Mythique sont taillés pour un héros déjà construit : avec un paquet neuf, c'est presque impossible. Chaque boss vaincu donne des <strong>éclats</strong> ({{ D.SEMAINE.eclats.normal }} en Normal, {{ D.SEMAINE.eclats.heroique }} en Héroïque, {{ D.SEMAINE.eclats.mythique }} en Mythique) : bonus de départ, ou travail du paquet entre deux donjons. Lundi, tout repart de zéro.</li>
            <li><strong>Clé mythique</strong> : gagner un donjon en Mythique avec la clé +N donne la clé +N+1 pour la semaine (jusqu'à +{{ D.PERILS.length - 1 }}). Chaque clé rend tous les monstres un peu plus forts (+{{ Math.round(D.CLE_PAR_NIVEAU.pv * 100) }} % de PV et +{{ Math.round(D.CLE_PAR_NIVEAU.deg * 100) }} % de dégâts par clé) et ajoute une épreuve ; elles se cumulent : <template v-for="(t, k) in D.PERILS.slice(1)">{{ k ? ' ; ' : '' }}+{{ k + 1 }} {{ t.charAt(0).toLowerCase() + t.slice(1) }}</template>.</li>
            <li><strong>Grimoire des Terres</strong> : des cartes rares à gagner dans la Vallée, contre le gardien du sanctuaire (un boss différent chaque semaine) ou en refermant une faille profonde. Elles restent pour toujours ; au départ d'un donjon, tu en glisses une dans ton paquet. Nouvelles mécaniques : 💨 <strong>Esquive</strong> (le prochain coup reçu ne te touche pas), 🔔 <strong>Écho</strong> (ta prochaine carte se joue deux fois), 🌱 cartes qui <strong>mûrissent</strong> (gardées en main d'un tour à l'autre, plus fortes à chaque tour), et <strong>alliés invoqués</strong> (✨ feu follet qui frappe seul, 🗿 golem qui prend les coups à ta place).</li>
            <li>À la fin, chacun garde les poussières d'étoile (5 poussières = 1 ⭐, comme en expédition). Donjon vaincu : un souvenir pour la maison de ton compagnon.</li>
          </ul>
        </section>
      </template>

  </div>

  <script src="vallee/vallee-regles.js"></script>
  <script>
    if (!ACCES.memorise()) location.replace('index.html');

    const CLE_SAUVEGARDE = 'donjon-sauvegarde';
    // Une faille des Terres de la Vallée (3.60) : donjon/?faille + `vallee-faille` = { id, nom, lieu, etage, ico } ;
    // un seul étage, sauvegardé à part (`donjon-faille`) pour ne pas toucher à l'exploration en cours
    const FAILLE = (function () {
      if (!/[?&]faille\b/.test(location.search)) return null;
      var f = lireStockage('vallee-faille');
      return f && typeof f.id === 'string' && f.etage >= 1 && f.etage <= DJ.NB_ETAGES ? f : null;
    })();
    const CLE_SOLO = FAILLE ? 'donjon-faille' : 'donjon-solo';
    // Le prochain donjon (3.82, demandé par l'utilisateur : « réfléchir avant de partir ») : ses 3 lieux sont tirés à l'avance
    // et montrés dans l'onglet Partie ; `donjon-prochain` = { l: [identifiants], n: [noms] } (les noms servent à l'accueil)
    function tirerProchain() {
      var l = DJ.D.ETAGES.map(E => E.lieux[Math.floor(Math.random() * E.lieux.length)]);
      var p = { l: l, n: l.map(id => DJ.D.LIEUX[id].nom) };
      ecrireStockage('donjon-prochain', p);
      return p;
    }
    function lireProchain() {
      var p = lireStockage('donjon-prochain');
      var ok = p && Array.isArray(p.l) && p.l.length === DJ.NB_ETAGES && p.l.every((id, i) => DJ.D.LIEUX[id] && DJ.D.ETAGES[i].lieux.indexOf(id) >= 0);
      return ok ? { l: p.l.slice(), n: p.l.map(id => DJ.D.LIEUX[id].nom) } : tirerProchain();
    }
    const _vignettes = {};
    const JEU_RESEAU = 'dj';
    const DELAI_SILENCE = 15000;
    const MAX_SALONS = 8;
    const COULEURS_J = ['#ff9800', '#339af0', '#51cf66', '#cc5de8', '#f06595', '#20c997'];
    const EFFETS = { coup: '💫', aie: '💢', pouf: '💨', ronces: '🔥', force: '💥', bond: '🪵', flair: '✨', coffre: '✨', porte: '🔓', coeur: '❤️', poussiere: '✨' };
    const SOUVENIRS = ['cle-donjon', 'coffre-tresor', 'bouclier', 'couronne-gluant'];
    function copie(o) { return JSON.parse(JSON.stringify(o)); }

    // Résumé de mon compagnon (le même que celui du salon global), envoyé à l'hôte
    function monCompagnon() {
      var a = lireStockage('compagnon-animal');
      if (!a || !a.espece) return null;
      var p = {};
      Object.keys(a.porte || {}).forEach(k => { if (!/^(exp|fete|mur|lampe|plante|jouet|couchage|tableau|horloge|fenetre|livres|radio|bocal)/.test(k)) p[k] = a.porte[k]; });
      return { e: a.espece, c: a.couleur, n: a.nom, p: p };
    }
    function nettoyerCp(c) {
      if (!c || typeof c !== 'object' || !DJ.ESPECES[c.e]) return null;
      var p = {};
      Object.keys(c.p || {}).slice(0, 12).forEach(k => { if (/^[a-z0-9-]{1,12}$/.test(k) && /^[a-z0-9-]{1,20}$/.test(c.p[k])) p[k] = c.p[k]; });
      return { e: c.e, c: /^#[0-9a-f]{6}$/i.test(c.c) ? c.c : '#c8915a', n: String(c.n || '').slice(0, 16) || 'Compagnon', p: p };
    }

    // ================== RÉSEAU ==================
    let peer = null;
    let connections = [];
    let connParPseudo = {};
    let hostConn = null;
    let dernierMsgHote = 0;
    let monPseudo = '';
    let pubHote = null;       // salle d'attente : { ordre, cps, phase, partieId }
    let partieHote = null;    // le donjon en cours (DJ), chez l'hôte ou en solo
    let salle = { infos: {} };
    let avsSalon = {};        // chez l'hôte : les avantages de la semaine de chaque joueur (3.29)

    // ---------- Ma semaine (3.29) : du lundi au dimanche, sur ce téléphone ----------
    function lundiDe(t) {
      var d = new Date(t); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (d.getDay() + 6) % 7);
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
    // La besace de la Vallée (fioles fabriquées chez Mme Sauge)
    // Grimoire des Terres (3.71) : cartes rares gagnées (permanent), et celle choisie pour le prochain donjon
    function lireGrimoire() {
      var g = lireStockage('donjon-grimoire') || {}, c = (Array.isArray(g.c) ? g.c : []).filter(id => { var k = DJ.carte(id); return k && k.rar === 'l'; });
      return { c: c, choix: c.indexOf(g.choix) >= 0 ? g.choix : null };
    }
    function lireBesace() {
      try { return Object.assign({}, VL.charger(lireStockage('vallee-etat')).besace); } catch (e) { return {}; }
    }
    function lireSemaine() {
      var s = lireStockage('donjon-semaine'), l = lundiDe(Date.now());
      if (!s || s.s !== l) return { s: l, ouvert: 'normal', cle: 0, b: {}, eclats: 0, faits: 0, hero: null, record: null, dernier: null };
      s = Object.assign({ ouvert: 'normal', cle: 0, b: {}, eclats: 0, faits: 0, hero: null }, s);
      delete s.tr;   // trophées de la 1re version (3.29), remplacés par le héros de la semaine (3.30)
      if (s.hero && !(s.hero.classe && Array.isArray(s.hero.paquet) && Array.isArray(s.hero.reliques))) s.hero = null;
      return s;
    }
    var cacheDessins = {};

    // Une carte du donjon (main, butin, marchand, paquet)
    Vue.component('carte-dj', {
      props: { id: String, badge: [Number, String], prix: Number, gratuite: Boolean },
      computed: { k: function() { return DJ.carte(this.id) || { nom: this.id, type: 'competence', texte: '' }; } },
      template: '<div class="carte-c" :class="[\'t-\' + k.type, \'r-\' + k.rar, { plus: k.plus }]">' +
        '<span class="cc-cout" :class="{ gratuite: gratuite && k.cout > 0 }" v-if="k.cout !== null && k.cout !== undefined">{{ gratuite ? 0 : k.cout }}</span>' +
        '<span class="cc-badge" v-if="badge !== null && badge !== undefined">{{ badge }}</span>' +
        '<span class="cc-ico">{{ k.ico }}</span><span class="cc-nom">{{ k.nom }}</span><span class="cc-txt">{{ k.texte }}</span>' +
        '<span class="cc-prix" v-if="prix">🪙 {{ prix }}</span></div>'
    });

    new Vue({
      el: '#app',
      data: {
        version: VERSION,
        DJ: DJ, POUVOIRS: DJ.POUVOIRS, ESPECES: DJ.ESPECES, EFFETS: EFFETS,
        onglet: 'config',
        pub: null,            // salle d'attente reçue
        partie: null,         // ce qu'on affiche du donjon (copie figée)
        salles: null,         // les pièces (envoyées seulement quand elles changent)
        carteV: 0,
        joueurs: [],
        solo: false,
        monCp: nettoyerCp(monCompagnon()),
        stats: lireStockage('donjon-stats') || { parties: 0, gagnes: 0 },
        difficulte: DJ.D.DIFFICULTES[lireStockage('donjon-difficulte')] ? lireStockage('donjon-difficulte') : 'heroique',
        dirCourante: null,
        sel: null,            // carte ou fiole touchée : { k: 'carte' | 'fiole', i } (un second toucher la joue)
        choixMenu: null,      // carte choisie dans une fenêtre (butin, marchand, paquet)
        voirPaquet: false,
        infoTxt: '', infoFiole: null,
        sem: lireSemaine(),   // ma semaine (3.29) : difficulté ouverte, clé, trophées, éclats et bonus
        VL: VL, besaceV: lireBesace(), fiolesV: lireStockage('donjon-fioles-vallee') || [],   // fioles de la Vallée (3.50)
        trSel: null, choixRel: [], msgRel: '', atelier: false, carteAt: null,
        RARETES_REL: { c: 'Commune', u: 'Peu commune', r: 'Rare', boss: 'De boss' },
        fenPartie: null,      // fenêtre de l'onglet Partie (3.78) : 'semaine', 'hero', 'sac' ou 'salon'
        infoClasse: false,    // texte du pouvoir et de la classe, sous le compagnon (3.78)
        prochain: lireProchain(),   // les 3 lieux du prochain donjon (3.82)
        lieuInfo: null,       // lieu touché dans l'onglet Partie : son texte s'affiche dessous
        grim: lireGrimoire(),   // Grimoire des Terres (3.71) : { c: cartes rares, choix }
        peril: Math.min(lireStockage('donjon-peril-choisi') || 0, lireSemaine().cle),
        vuCombat: null,
        D: DJ.D, MONSTRES: DJ.MONSTRES,
        inverse: lireStockage('donjon-inverse') === true,   // croix à droite (sur ce téléphone)
        coupActif: false,
        demandeQuitter: false,
        entreeCombat: null,
        aLire: [],           // messages du moteur à lire dans une fenêtre (annonces marquées « lire » pour moi), dans l'ordre (3.42)
        lieuAnnonce: null,   // { cle, t } : la fenêtre qui présente un lieu à règle, une fois par étage (3.41)
        diagT: 0,
        chatVisible: false,      // la discussion du salon est ouverte par-dessus le jeu (3.33)
        confirmePasser: false,   // « Passer » le butin demande un 2e toucher (3.33)             // horloge du voyant de liaison (3.32), avancée chaque seconde à plusieurs   // { id, rang, noms, t } : la fenêtre d'entrée en combat (3.31)
        immersionVoulue: lireStockage('donjon-plein-ecran') !== false,   // plein écran pendant l'exploration (par téléphone)
        barresCachees: lireStockage('donjon-barres') !== false,   // en plein écran, cacher aussi les barres du téléphone (le navigateur affiche alors son message pour sortir)
        menuJeu: false,
        voirSac: false,
        chatNonLus: 0,
        demandeAbandon: false,
        panne: false,
        soloV: 0,
        gains: null,
        pseudoInput: pseudoPour('donjon-sauvegarde'),
        channelInput: lireStockage('donjon-dernier-salon') || lireStockage('brillant-dernier-salon') || '',
        salonsConnus: lireStockage('brillant-salons') || [],
        role: null,
        connexion: 'aucune',
        roomCode: '',
        entreeEnCours: false,
        sonActif: lireStockage('brillant-son') !== false,
        peutVibrer: typeof navigator.vibrate === 'function',
        vibrationActive: lireStockage('brillant-vibration') !== null ? lireStockage('brillant-vibration') !== false : lireStockage('brillant-son') !== false
      },
      computed: {
        moi: function() { return this.solo ? 'Moi' : (this.pseudoInput.trim() || 'Moi'); },
        monPouvoir: function() { return DJ.pouvoirDe(this.monCp); },
        connexionTexte: function() { return { ok: 'en ligne', connexion: 'connexion…', perdue: 'reconnexion…', aucune: 'hors ligne' }[this.connexion]; },
        // Les 3 lieux montrés dans l'onglet Partie (3.82) : l'exploration en cours, la salle d'attente du salon, ou le prochain donjon
        lieuxDep: function() {
          var s = null, ids = null, etage = 0, titre = 'Ton prochain donjon';
          if (this.soloEnCours && !this.role) { s = this.solo && this.partie ? this.partie : lireStockage(CLE_SOLO); titre = 'Ton exploration en cours'; }
          else if (this.role && this.partie && this.partie.phase === 'jeu') { s = this.partie; titre = 'Le donjon du salon'; }
          else if (this.role && this.pub && Array.isArray(this.pub.lieux)) { ids = this.pub.lieux; titre = 'Le donjon du salon'; }
          if (s && s.faille) return null;
          if (s) etage = s.etage || 1;
          var liste = DJ.D.ETAGES.map((E, i) => {
            var L = s ? DJ.lieu(s, i + 1) : (DJ.D.LIEUX[(ids || this.prochain.l)[i]] || E);
            if (L.etage !== i + 1) L = E;
            var R = L.regle ? DJ.D.REGLES_LIEU[L.regle] : null, B = DJ.MONSTRES[L.boss];
            return { cle: (i + 1) + ':' + L.id, etage: i + 1, id: L.id, nom: L.nom, ico: L.ico, regle: R, boss: B ? B.nom : '',
                     etat: !etage ? '' : i + 1 < etage ? 'fait' : i + 1 === etage ? 'ici' : '', svg: this.vignetteLieu(L, i), bossSvg: L.boss ? DJS.monstre(L.boss) : '' };
          });
          return { titre: titre, liste: liste, enCours: !!etage };
        },
        lieuChoisi: function() { var L = this.lieuxDep; return L ? L.liste.find(v => v.cle === this.lieuInfo) || null : null; },
        soloEnCours: function() { this.soloV; if (this.solo && this.partie && this.partie.phase === 'jeu') return true; var s = lireStockage(CLE_SOLO); return !!(s && s.phase === 'jeu'); },
        // Difficulté du salon (choisie par l'hôte) ; une partie lancée garde la sienne
        difficulteSalon: function() {
          var d = (this.partie && this.partie.difficulte) || (this.pub && this.pub.difficulte);
